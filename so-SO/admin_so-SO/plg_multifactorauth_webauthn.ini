PLG_MULTIFACTORAUTH_WEBAUTHN="Aqoonsiga dhinac-faraca badan - Furaha Quruxda"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Codsi aqoonsi khaldan."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_PK="Diiwaangelinta furaha quruxda ayaa guuldareysatay. Jawaabta furaha quruxda ee laga helay browser-ka kuma waafaqsana Furaha Dadweynaha ee uu soo saaray server-ka. Tani waxay ka dhigan tahay in qof isku dayay inuu ku jabsado ama wax aan hagaagsaneyn."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_USER="Sababo nabadgelyo awgood looma oggola inaad diiwaangeliso furaha quruxda qof kale."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Waxbaa qaldamay laakiin faahfaahin dheeri ah oo ku saabsan khaladka lama heli karo waqtigan. Fadlan mar kale isku day inaad diiwaangeliso furahaaga quruxda."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_PK="Serverku ma soo saarin Furaha Dadweynaha si loogu diiwaangeliyo furaha quruxda laakiin si kedis ah codsi diiwaangelinta furaha quruxda laga helay browser-ka. Tani waxay ka dhigan tahay in qof isku dayay inuu ku jabsado ama wax aan hagaagsaneyn."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_BODY="Browser-kaaga ma taageero heerka furaha quruxda. Dhammaan browser-yada uma mid aha inay la jaan qaadaan furayaasha quruxda dhamaan qalabka illaa hadda."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_HEAD="Browser-kaaga ma laha taageero furayaasha quruxda"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_BODY="Fadlan gal goobta adoo isticmaalaya HTTPS si aad u awood siiso Aqoonsiga dhinac-faraca badan oo leh furaha quruxda."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTHTTPS_HEAD="Furaha quruxda waxaa laga heli karaa kaliya HTTPS"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Waxaad weli ma aadan qaabeyn furaha quruxda ama furaha quruxda ee aad isku dayeyso inaad isticmaashid ma aha mid u qalma."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_CONFIGURED="Waad durba qaabeeysay furahaaga quruxda. Fadlan ogow in kaliya aad bedeli karto magaceeda halkan ka."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_DISPLAYEDAS="Furaha Quruxda"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_INSTRUCTIONS="Adeegso badhanka &ldquo;%s&rdquo; ee boggan si aad u bilowdo habka Aqoonsiga Webka. Ka dib fadlan raac tilmaamaha browser-kaaga si aad u dhammaystirto Aqoonsiga Webka adigoo adeegsanaaya furahaaga quruxda ee aad doorbideyso."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_REGISTERKEY="Diiwaangeli furahaaga quruxda"
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_SHORTINFO="Adeegso furayaasha quruxda browser-ka leh furaha amniga qalabka ama software-ka."
PLG_MULTIFACTORAUTH_WEBAUTHN_LBL_VALIDATEKEY="Sax furahaaga quruxda adoo isticmaalaya"
PLG_MULTIFACTORAUTH_WEBAUTHN_XML_DESCRIPTION="Adeegso furayaasha quruxda browser-ka ee hab ahaan Aqoonsiga dhinac-faraca badan. Dhammaan browser-yada casriga ah way taageeraan. Inta badan browser-yada waxay bixiyaan aqoonsi gaar ah oo loogu talagalay qalabka oo lagu ilaaliyay erayga sirta ah iyo/ama biometrics (sensor faraha, sawirka wajiga, &hellip;)."

