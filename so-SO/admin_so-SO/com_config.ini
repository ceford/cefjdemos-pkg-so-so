COM_CONFIG_TEXT_FILTERS_DESC="Dejimaha fiiro qoraalka waxaa lagu dabaqi doonaa dhammaan meelaha tafatirka qoraalka ee kooxaha la xulay.<br>Xulashooyinkan fiiro ayaa ku siin doona xakameyn badan bogagga HTML ee ay soo gudbiyaan bixiyeyaashaada nuxurka. Waxaad noqon kartaa mid adag ama mid debecsan sida aad u baahan tahay si ay ugu habboonaato baahiyaha shabakaddaada. Filtroku waa doorasho waajib ah waxaana dejimaha caadiga ahi ay bixiyaan ilaalin wanaagsan ka dhanka ah calaamadaha si guud loo xiriirinayo weerarada boggaga internetka."
