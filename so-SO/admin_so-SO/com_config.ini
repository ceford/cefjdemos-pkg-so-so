JLIB_RULES_SETTING_NOTES_COM_CONFIG="Haddii aad bedesho dejinta, waxay saameyn doontaa tan iyo dhammaan kooxaha carruurta, qaybaha iyo nuxurka. Ogow in:<br><em><strong>Dhidhiban</strong></em> ay ka dhigan tahay in rukhsadaha laga soo qaadi doono kooxda waalidka.<br><em><strong>La diiday</strong></em> waxay ka dhigan tahay in, si kasta oo loo deji {ay kooxda waalidka tahee}, kooxda la tafatiraya aysan qaadan karin ficilkan.<br><em><strong>La ogolaaday</strong></em> waxay ka dhigan tahay in kooxda la tafatirayo ay u suurtageli doonto in ay ficilka qaadato (laakiin haddii tan ay ku dhexjirto waxyeelo kooxda waalidka, saamayn ma laha; khilaaf waxaa tilmaamaya <em><strong>Lagama Ogolaan (La xirey)</strong></em> oo hoos tagaya Barbaro Lacag ah). <br><em><strong>Aan La Dejinin</strong></em> waxaa loo isticmaalaa kaliya kooxda Dadweynaha ee qaabka caalamiga ah. Kooxda Dadweynaha waa waalidka dhammaan kooxaha kale. Haddii aan rukhsad la dejin, waxaa loo haystaa in la diiday laakiin waa la beddeli karaa kooxaha carruurta, qaybaha, qaybaha iyo shayada."

