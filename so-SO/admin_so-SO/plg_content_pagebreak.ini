PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>Ogolaanshaha abuurista maqaal qaybaysan oo aan lahayn doorasho jadwalka mowduucyada.</p><p>Ku dar joojinta bogga adoo adeegsanaya batoonka joojinta bogga ee badanaa laga helo suunka qalabka tafatiraha WYSIWYG. Meesha joojinta bogga ee maqaalka waxaa lagu soo bandhigi doonaa tafatiraha sida xariiq toosan oo fudud.</p><p>Qoraalka la soo bandhigay wuxuu ku xirnaan doonaa doorashooyinka la xushay wuxuuna noqon karaa cinwaanka, qoraal kale (haddii la bixiyo) ama nambarada bogagga.</p><p>Isticmaalka HTML-ka waa:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Cinwaanka bogga&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Bogga ugu horreeya&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Cinwaanka bogga&quot; alt=&quot;Bogga ugu horreeya&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Bogga ugu horreeya&quot; title=&quot;Cinwaanka bogga&quot; /&gt;</p>"

