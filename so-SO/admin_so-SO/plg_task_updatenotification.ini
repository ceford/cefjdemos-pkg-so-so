PLG_TASK_UPDATENOTIFICATION_XML_DESCRIPTION="Hawshani waxay si joogto ah u hubisaa diyaaradda noocyada cusub ee Joomla! Markii mid laga helo, waxay kuu soo diri doontaa emayl, oo ku xusuusinayaa inaad cusboonaysiiso. Waxaad u habeyn kartaa emaylka <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">Nidaamka &rarr; Qaab-dhismeedka Mail.</a>"

