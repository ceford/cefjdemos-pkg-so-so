PLG_TASK_UPDATENOTIFICATION="Hawlgal - Ogeysiinta Cusboonaysiinta Joomla!"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Liiska cinwaanada email-ka ee kala soocan kuwajaaran oo heli doona emails-ka ogeysiiska cusboonaysiinta. Cinwaanada ku jira liiska waa in ay ka tirsan yihiin isticmaalayaasha hadda jira ee goobtaada ee leh mudnaanta Super User. Haddii midkoodna ka mid ah emails kuwa liiska ku jira aysan ka tirsanayn Super Users, ama haddii la dhaafo, dhammaan Super Users-ka goobta waxay heli doonaan email-ka ogeysiiska cusboonaysiinta."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Emails-ka Super User"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Ogeysiinta Cusboonaysiinta Joomla!"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Hawlgalkan wuxuu si isdaba joog ah u eegayaa helitaanka noocyada cusub ee Joomla!. Marka mid la helo, waxaa laguu soo diri doonaa email, oo kugula xasuusinaya inaad cusboonaysiiso. Waad u habeyn kartaa email-ka <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">Habka &rarr; Tusaalooyinka Mail</a>"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Xulo luqadda emailada ogeysiinta cusboonaysiinta. U dhig Auto si aad ugu dirto luqadda goobta waqtiga meesha jira."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Luqadda Email"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Auto"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="Email-kani MA aha mid ka yimid mashruuca Joomla! Waxaa si toos ah u dirtey boggaaga kuu gaarka ah,\n{SITENAME} - {URL} \n\n================================================================================\nMAACLUUMAADKA CUSBOONAYSIISTA\n================================================================================\n\nGoobtaadu waxay ogaatay in uu jiraa nooc cusub oo Joomla! ah.\n\nNooca Joomla! ee hadda rakiban: {CURVERSION}\nNooca Joomla! ee diyaar u ah rakibidda: {NEWVERSION}\n\nEmail-kan waxaa laguu soo direy boggaaga si laguugu xasuusiyo xaqiiqadan.\nMashruuca Joomla! marna lagama soo xiriiri doono si toos ah noocyada cusboonaysiinta ee Joomla! goobtaada.\n\n================================================================================\nTILMAAMAHA CUSBOONAYSIISTA\n================================================================================\n\nSi aad ugu rakibto cusboonaysiinta {SITENAME}, fadlan xulo xiriirka ku habboon. (Haddii URL-ka uusan aheyn xiriir, nuqul & dhejiso boggagaaga).\n\nXiriirka Cusboonaysiinta: {LINK}\n\nWararka Sii deynta waxaa laga heli karaa halkaan: {RELEASENEWS}\n\n================================================================================\nMAXAA LOO DIREY EMAILKAN?\n================================================================================\n\nEmail-kani si otomaatig ah ayaa loo soo diray iyadoo loo marayo  plugin ay bixiso Joomla!, software ka shaqeeya boggaaga.\nPlugin-kan wuxuu raadraacayaa noocyada cusub ee Joomla! waxaana u soo dirayaa maamulka email ogeysiis ah.\nWaxaad heli doontaa dhowr emails oo la mid ah tan goobtaada ilaa aad ka cusboonaysiiso software-ka ama joojiso emails-kan.\n\nSi aad u joojiso emails-kan, fadlan daabaco ciyaar la'aan plugin-ka 'Hawlgal - Ogeysiiska Cusboonaysiinta Joomla!' ee Maareeyaha Plugin-ka ee goobtaada.\n\nHaddii aanad fahmin waxa Joomla! yahay iyo waxaad u baahan tahay inaad sameyso, fadlan ha la xiriirin mashruuca Joomla!\nIyada ma aha kuwa kuugu soo diraaya email-kan mana awoodaan inay ku caawiyaan. Taabadalkeed, fadlan la xiriir qofka dhisay ama maamula boggaaga.\n\nHaddii aad tahay qofka dhisay ama maamula boggaaga, fadlan ogow in plugin-kan loo fidiyay otomaatig markii aad rakibtay ama cusboonaysiisay Joomla! goobtaada.\n\n================================================================================\nYAAYII DIRAY EMAILKAN?\n================================================================================\n\nEmail-kani waxaa sidoo kale loo diray adiga oo leh boggaaga kuu gaarka ah, {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
PLG_TASK_UPDATENOTIFICATION_EMAIL_SUBJECT="Cusboonaysiinta Joomla! ayaa diyaar u ah {SITENAME} – {URL}"
PLG_TASK_UPDATENOTIFICATION_MAIL_MAIL_DESC="Waxaa loo diraa maamulka goobta markuu shaqada &quot;Joomla! Update Notification&quot; ee awood u leh ogaado cusboonaysiin."
