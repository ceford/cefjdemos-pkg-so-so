COM_ACTIONLOGS_POSTINSTALL_BODY="<p>Soo saarista Joomla 3.9.0 waxaad hadda diiwaan gelin kartaa dhammaan ficillada maamul ee ay sameeyeen isticmaalayaashaada qaababka taageerada leh. Hadda way fududahay in la arko cidda sameysay iyo goorta la sameeyay.</p><p>Diiwaanka waxaa dib loogu eegaa Joomla ama waxaa loo dhoofin karaa isticmaalka dibadda.</p><p>Macluumaad dheeraad ah oo ku saabsan sifooyinkan cusub akhri waxyaabaha ku saabsan <a href='https://docs.joomla.org/Special:MyLanguage/J3.x:User_Action_Logs' target='_blank' rel='noopener noreferrer'>Diiwaanka Ficilada Isticmaalayaasha.</a></p>"
