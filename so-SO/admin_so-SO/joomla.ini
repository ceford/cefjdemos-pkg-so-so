JGLOBAL_FILTER_TYPE_DESC="<p>1. Liiska La Xarrimay wuxuu oggol yahay dhammaan sumadaha iyo astaamaha marka laga reebo kuwa ku qoran.<br><strong>--</strong> Sumadaha ku jira Liiska La Xarrimay ee Asalka ah waxaa ka mid ah: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Astaamaha ku jira Liiska La Xarrimay ee Asalka ah waxaa ka mid ah: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Waxaad xarrimi kartaa sumaddo iyo astaamo dheeraad ah adoo ku daraya meelaha Sumaadaha Filter iyo Astaamaha Filter, oo magac kasta oo sumad ama astaam ah ku kala sooc ku dar oo ku dar.<br><strong>--</strong> Liiska La Xarrimay ee Gaarka ah wuxuu kuu ogolaanayaa inaad badasho Liiska La Xarrimay ee Asalka ah. Ku dar sumadaha iyo astaamaha la xarrimayo meelaha Sumaadaha Filter iyo Astaamaha Filter.</p><p>Liiska La Ogol yahay wuxuu ogolaanayaa kaliya sumadaha ku qoran meelaha Sumaadaha Filter iyo Astaamaha Filter.</p><p>Lahaansho HTML waxay ka saartaa dhammaan sumadaha HTML ee ku jira waxyaalaha marka la keydiyo.</p><p>Fadlan ogow in dejimahaasi ka shaqeeyaan iyadoo aan loo eegin tifaftire aad isticmaaleyso. <br>Xitaa haddii aad isticmaaleyso tifaftire WYSIWYG, dejimaha sifeynta waxay ka saari karaan sumado dheeraad ah iyo astaamo kahor inta aan la kaydin macluumaadka keydka xogta.</p>"
