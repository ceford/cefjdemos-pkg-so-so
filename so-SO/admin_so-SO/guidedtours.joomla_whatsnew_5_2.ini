COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_DESCRIPTION="<h1 class=\"fw-medium\">Ku soo dhawoow Joomla 5.2!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/enhancedtourheader.png\" alt=\"Tallaabada ugu horreysa ee socdaalku, tusmada cusub ee madaxa\" width=\"640\" height=\"384\"></div><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Cusboonaysiinta Socdaallada Hagidda</h2><h3>Socdaalo Is-ku bilaaba</h3><p>Astaantan waxay kuu oggolaan doontaa inaad abuurato socdaalkaaga Hagidda oo is-ku bilaaba. Socdaalka durugsan waa la ka bixi karaa mid ama dhammaan isticmaale. Socdaallada waxaa laga soo ceshan karaa menu-ga Socdaallada Hagidda.</p><h3>Horumarinta</h3><ul class=\"mb-3\"><li>Si loo cadeeyo, <em>Tiirka Tallaabooyinka</em> ayaa la dhigey in la dhigo ugu horeysa ee madaxa socdaalka.</li><li>Daaqadda modolka ayaa is-diiraysa si toos ah si ay ugu habboonaato nuxur iyo sawir weyn.</li></ul></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Cusboonaysiinta Nidaamka</h2><h3>Qaabka cusub ee 'Maqaalo' oo dhan isku jira</h3><p>Isticmaal hal module si aad u soo bandhigto hada ugu dambeeya, sideed ugu akhrisan badan, khaas ama heego maqaallo, laga soo bilaabo qaybaha la doortay - iyadoo leh shaandhooyin, calaamado yaryar iyo in ka badan...</p><p>Laga bilaabo <span class=\"fw-medium\">Mawduuc -&gt; Goobaha Mareegaha</span>, abuur module cusub oo nooca 'Maqaalo'.</p><h3>Qaabdhismeedka Template-ga Mailka</h3><p>Qaado talaabo ka sii fogtahay adigoo abuuraya qaab dhismeed gaar ah oo ugu langageygaar ah (oo ay ku jirto calaamadda) oo lagu dabaqi karo hal ama dhammaan template-yada mailka.</p><p>Laga bilaabo <span class=\"fw-medium\">Qaabeynta Guud -&gt; Template-yada Mailka</span>, qaabeynta waxaa lagu qeexi karaa HTML.</p><h3>Horumarinta iyo Dayactir Kale</h3><ul class=\"mb-3\"><li>Subforms Dunnid - Waxay ogolaataa dunnidda Subform gudaha Subform Custom Field.</li><li>Tirada Guud - Waxay muujinaysaa tirada iyo tirada guud ee waxyaabaha liiska ku jira console-ka.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/mailtemplate.png\" alt=\"Tusaale template mail, oo ay ku jiraan calaamadda madax iyo hoose\" width=\"640\" height=\"370\" loading=\"lazy\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_TITLE="Maxaa Cusub ee ku jira Joomla 5.2!"

