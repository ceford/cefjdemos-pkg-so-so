COM_USERS_POSTINSTALL_MULTIFACTORAUTH_ACTION="Karti geli ku dar Mult-factor Authentication plugins cusub"
COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla! waxay la timaaddaa waayo-aragnimo aad u horumarsan oo <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">Multi-factor Authentication</a> si ay kaaga caawiso adkeynta gelitaanka isticmaaleyaashaaga.</p><p>Sida ka duwan sifooyinka Laba Factor Authentication ee noocyadii hore ee Joomla, isticmaaleyaashu <em>marka hore uma baahna inay geliyaan Koodka Amniga oo ay la socdaan magaca isticmaale iyo lambarka sirta ah</em>. Multi-factor Authentication wuxuu dhacaa talaabo gaar ah kadib markaad gudaha gasho goobta. Inta ay dhammaynayaan xaqiijinta Multi-factor Authentication isticmaaleyaashu ma booqan karaan bogag kale ama ma isticmaali karaan goobta. Tan waxay ka dhigaysaa Multi-factor Authentication in ay <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">phishing</a>&ndash;celin ah. Waxay sidoo kale u oggolaaneysaa hababka xaqiijinta is-dhexgalka sida furaha-codka (oo ay ku jiraan isku xirka Windows Hello, Apple TouchID / FaceID iyo Android Biometric Screen Lock), ama dirida koodhadh xaqiijin ah oo 6-god ah email ahaan. Labada hab ee is-dhexgalka, oo fudud ayaa hadda la heli karaa sida plugins oo la socda Joomla! lafteeda.</p>"
