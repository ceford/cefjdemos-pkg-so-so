PLG_SYSTEM_JOOA11Y_QA_BAD_ITALICS="Tags-ka xariijimaha iyo dhegaha ah ayaa leh macno semantik, waana in aan <strong>laga faa'iidaysan</strong> si loo muujiyo qoraalada dhan. Qoraalka xariijimeysan waa in loo isticmaalo in lagu bixiyo muujin dhan <strong>xoogeystay</strong> eray ama jumlad. Dhegaha waa in loo isticmaalo in lagu muujiyo magacyada saxda ah (tusaale, cinwaanka buugaagta iyo qoraalada), erayo shisheeye, oo halqabsiyada. Halqabsiyo dheer waa in loo qaabeeyaa sidii blockquote."
