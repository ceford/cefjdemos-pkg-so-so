PLG_SYSTEM_JOOA11Y="Nidaamka - Hubiyaha Helitaanka Joomla"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="Meesha Bartilmaameedka ah ee La Hubinayo"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="Geli xulasho keli ah si aad ula beegsato qayb cayiman oo ka mid ah boggaaga. Deegaanka la heli karo waa calaamadda <strong>ugu weyn</strong>. Meelo kale oo ah kuwo la heli karo waa fasalada, walxaha ama doorarka ARIA (tusaale ahaan #wax-soo-saar, .wax-soo-saar, [door=' ugu weyn']). Geli <strong>jidhka</strong> si aad u hubiso bogga oo dhan."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="Demi Haddii"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="Demi hubinta cayiman iyadoo la adeegsanayo magaca muhiimka ah. Baro sida loo <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">Demi Haddii</a>."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="Ka - Taalada Gobollada"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="Ka - talawaado qaybaha gaarka ah ee ku jira Mudheelka Mawduucyada. Waxaad isticmaal kartaa tixraacyo (tusaale ahaan #inanla-qaadan-ama,. inanla-qaadan-ama)."
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="Hantida Dheeraadka Ah"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="Gudbi astaamo dheeri ah si aad u habayso. Baro sida loo daro <a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">Hantida Dheeraadka Ah</a>."
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="Meesha Bartilmaameedka Akhriska"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="Calaamadeynta bogga oo la hubin doono akhriska. Deegaanka la heli karo waa calaamadda <strong> ugu weyn</strong>."
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="Mar Walba Muuji"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="Xidhmo hubiyaha helitaanka bogagga oo dhan. Tani waxay faa'iido leedahay marka la hormarinayo bogga, laakiin laguma sii dayn karo marka bogga uu leeyahay toos gaadhsiin ah."
PLG_SYSTEM_JOOA11Y_KEY="Muhiimad"
PLG_SYSTEM_JOOA11Y_VALUE="Qiimaha"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Hubiyaha Helitaanka Joomla wuxuu si muuqata u iftiimiyaa dhibaatooyinka guud ee helitaanka iyo isticmaalka. Iyadoo loo gogol bixinayo qoraal sameeyayaasha arrinta, plugin-ku wuxuu tilmaamayaa khaladaadka ama digniinaha wuxuuna bixiyaa tilmaamo ku saabsan sida loo saxo. Fadlan la soco in plugin-kan uusan bixin baaritaan buuxa oo ku saabsan boggaaga, mana hubiyo si otomatig ah helitaanka boggaaga. Waa muhiim in la doorto qaabab ku saleysan helitaanka si aad ugu hubiso in boggaaga uu la kulmo heerarka helitaanka."

