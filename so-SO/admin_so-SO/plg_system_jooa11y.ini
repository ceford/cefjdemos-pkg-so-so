PLG_SYSTEM_JOOA11Y_ALERT_TEXT="Digniin"
PLG_SYSTEM_JOOA11Y_AVG_WORD_PER_SENTENCE="Celcelis ereyada halkii jumlad:"
PLG_SYSTEM_JOOA11Y_COMPLEX_WORDS="Ereyada adag:"
PLG_SYSTEM_JOOA11Y_CONTAINER_LABEL="Hubiyaha Helitaanka"
PLG_SYSTEM_JOOA11Y_CONTRAST="Kala duwanaansho"
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_INPUT_MESSAGE="Qoraalka ku jira meeshan ma laha kala duwanaansho ku filan asalka. Heerka kala duwanaanshaha wuxuu noqonayaa ugu yaraan 4.5:1 qoraalka caadiga ah iyo 3:1 qoraalka waaweyn."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_INPUT_MESSAGE_INFO="Heerka kala duwanaanshaha waa <strong>%(cratio)</strong>."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_MESSAGE="Qoraalkan ma laha kala duwanaansho ku filan asalka. Heerka kala duwanaanshaha wuxuu noqonayaa ugu yaraan 4.5:1 qoraalka caadiga ah iyo 3:1 qoraalka waaweyn."
PLG_SYSTEM_JOOA11Y_CONTRAST_ERROR_MESSAGE_INFO="Saamiga isbarbardhigga waa <strong>%(cratio)</strong> qoraalka soo socda: <strong>%(nodetext)</strong>"
PLG_SYSTEM_JOOA11Y_CONTRAST_WARNING_MESSAGE="Isbarbardhigga qoraalkan lama yaqaan waana in si gacanta ah loo eego. Hubi in qoraalka iyo asalka ay leeyihiin midabyo si xoogan isugu jira. Saamiga isbarbardhigga waa in uu noqdaa ugu yaraan 4.5:1 qoraalka caadiga ah iyo 3:1 qoraalka weyn."
PLG_SYSTEM_JOOA11Y_CONTRAST_WARNING_MESSAGE_INFO="Fadlan eeg isbarbardhigga qoraalka soo socda:<br><strong>%(nodetext)</strong>"
PLG_SYSTEM_JOOA11Y_DARK_MODE="Habka Madoow"
PLG_SYSTEM_JOOA11Y_DIFFICULT_READABILITY="Adag"
PLG_SYSTEM_JOOA11Y_EMBED_AUDIO="Fadlan hubi inaad bixiso <strong>waraaqda qoraalka ee dhammaan podcast-yada.</strong> Bixinta waraaqaha qoraalka ee maqal waa shuruud heer A oo qasab ah. Waraaqaha qoraalka waxay taageeraan dadka maqli kari waaga ah ama maqalka la'aanta ah, laakiin qof walba way anfici karaan. Tixgeli inaad waraaqda qoraalka ku dhigto hoos ama gudaha guddi laabmaysa."
PLG_SYSTEM_JOOA11Y_EMBED_GENERAL_WARNING="Ma suurtagelin in la hubiyo waxa lagu dhex daray. Fadlan hubi in sawirradu leeyihiin qoraal beddel ah, fiidiyowyadu leeyihiin qoraalo, qoraalku leeyahay isbarbardhig kafiilan, iyo qaybaha fariinta leh ay yihiin <a href=\"https://webaim.org/techniques/keyboard/\" target=\"_blank\" rel=\"noopener noreferrer\">furayaasha la heli karo.</a>"
PLG_SYSTEM_JOOA11Y_EMBED_MISSING_TITLE="Waxa la dhexgeliyey waxay u baahan yihiin magac heli-kar ah oo tilmaamaya waxa ku jira. Fadlan bixi magac gaar ah <span class=\"jooa11y-kbd\">ciwaan</span> ama <span class=\"jooa11y-kbd\">astaanta aria-label</span> ee shayga <span class=\"jooa11y-kbd\">iframe</span>. Wax dheeraad ah ka baro <a href=\"https://dequeuniversity.com/tips/provide-iframe-titles\" target=\"_blank\" rel=\"noopener noreferrer\">iFrames.</a>"
PLG_SYSTEM_JOOA11Y_EMBED_VIDEO="Fadlan hubi <strong>in dhammaan fiidiyowyadu leeyihiin qoraalo xiran.</strong> Bixinta qoraalada dhammaan maqal iyo muuqaal waa shuruud heer A oo qasab ah. Qoraaladu waxay taageeraan dadka maqli kari waaga ah ama maqalka la'aanta ah."
PLG_SYSTEM_JOOA11Y_ERROR="Khalad"
PLG_SYSTEM_JOOA11Y_FAIRLY_DIFFICULT_READABILITY="Aad u adag"
PLG_SYSTEM_JOOA11Y_FIELD_ADDITIONAL_CHECKS="Hubinta dheeraad ah had iyo jeer"
PLG_SYSTEM_JOOA11Y_FIELD_ADDITIONAL_CHECKS_DESC="Dammaan gelinta ikhtiyaarkan waxay si muuqata u qarin doontaa furayaasha hakadka ee Shaqaalaha Foomamka, Isbarbardhigga, Xiriirrada (Advanced) ee gudiga Goobaha."
PLG_SYSTEM_JOOA11Y_FIELD_COLOUR_FILTER="Shaandhaynta Midabka"
PLG_SYSTEM_JOOA11Y_FIELD_COLOUR_FILTER_DESC="Tusay habka Shaandhaynta Midabka ee gudiga Goobaha. Shaandhaynta midabku waxay caawisaa aqoonsiga isku dhafka midabada oo adkaan kara in dadka ay kala soocaan."
PLG_SYSTEM_JOOA11Y_FIELD_CONTRAST="Isbarbardhig"
PLG_SYSTEM_JOOA11Y_FIELD_CONTRAST_DESC="Tusay habka Isbarbardhig ee gudiga Goobaha. Hubi dhibaatooyinka isbarbardhigga heerka AA ee WCAG 2.0 ee u dhexeeya qoraalka hore iyo qaybaha asalka ah."
PLG_SYSTEM_JOOA11Y_FIELD_FORM_LABELS="Shaqaalaha Foomamka"
PLG_SYSTEM_JOOA11Y_FIELD_FORM_LABELS_DESC="Tusay habka Shaqaalaha Foomamka ee gudiga Goobaha. Hubi gelinta foomamka ee u baahan astaanta la xidhiidha. Tani ma aha sida caadiga ah dhibaatada qoraaga nuxurka, mana aha dhibaato marka la isticmaalayo foomamka sumcad leh oo la heli karo."
PLG_SYSTEM_JOOA11Y_FIELD_LINKS_ADVANCED="Xiriirrada (Advanced)"
PLG_SYSTEM_JOOA11Y_FIELD_LINKS_ADVANCED_DESC="Tusay habka Xiriirrada (Advanced) ee gudiga Goobaha. Hubi dhibaatooyin dheeraad ah sida: xiriiriyeyaasha fura tab cusub iyaga oo aan digniin bixin, magac isku mid ah leh laakiin ujeedo kala duwan leh, ama tilmaamaya PDF iyo faylal kale iyaga oo aan digniin bixin."
PLG_SYSTEM_JOOA11Y_FIELD_WEB_COMPONENTS="Qaybaha Web-ka ee La Hubinayo"
PLG_SYSTEM_JOOA11Y_FIELD_WEB_COMPONENTS_DESC="Bixi liiska dhammaan qaybaha web-ka ama weelasha la yaqaan ee leh summad hoosbidhay oo furan."
PLG_SYSTEM_JOOA11Y_FILE_TYPE_WARNING="Xiriirku wuxuu tilmaamayaa PDF ama fayl la soo dejisan karo (tusaale: MP3, Zip, Word Doc) iyada oo aan digniin lahayn. Caddee nooca faylka gudahooda qoraalka xiriirka. Haddii uu yahay fayl weyn, tixgeli inaad ku darto tirada cabbirka faylka."
PLG_SYSTEM_JOOA11Y_FILE_TYPE_WARNING_TIP="<strong:Tusaale:</strong> Warbixinta Fulinta (PDF, 3MB)"
PLG_SYSTEM_JOOA11Y_FORM_LABELS="Calaamadaha foomka"
PLG_SYSTEM_JOOA11Y_GOOD="Wanaagsan"
PLG_SYSTEM_JOOA11Y_GOOD_READABILITY="Wanaagsan"
PLG_SYSTEM_JOOA11Y_HEADING_EMPTY="Ciwaanka madhan ayaa la helay! Si aad u hagaajiso, tirtir khadkaas ama u beddel qaabka <strong>Ciwaanka %(level)</strong> si uu noqdo <strong>Caadi</strong> ama <strong>Qodob</strong>."
PLG_SYSTEM_JOOA11Y_HEADING_EMPTY_WITH_IMAGE="Ciwaanku ma laha qoraal, laakiin waxa ku jira sawir. Haddii tani aysan ahayn ciwaan, beddel qaabkiisa oo ka soo qaad <strong>Ciwaanka %(level)</strong> ilaa <strong>Caadi</strong> ama <strong>Qodob</strong>. Haddii kale, fadlan ku dar qormada alt sawirka haddii uusan ujeeddo lahayn."
PLG_SYSTEM_JOOA11Y_HEADING_FIRST="Ciwaanka ugu horreeya ee bogga waa inuu badanaa noqdaa Ciwaanka 1 ama Ciwaanka 2. Ciwaanka 1 waa inuu noqdaa bilowga qaybta guud ee mawduuca, wuxuuna yahay ciwaanka ugu weyn ee sharxaya ujeeddada guud ee bogga. Wax ka baro <a href=\"https://www.w3.org/WAI/tutorials/page-structure/headings/\" target=\"_blank\" rel=\"noopener noreferrer\">Qaabka Ciwaanka.</a>"
PLG_SYSTEM_JOOA11Y_HEADING_LONG="Ciwaanku waa dheer yahay! Ciwaanada waa in loo isticmaalaa abaabulka nuxurka iyo gudbinta qaab-dhismeedka. Waa inay gaaban yihiin, macluumaad yihiin, oo gaar u yihiin. Fadlan ku hay ciwaanada in ka yar 160 xaraf (hal jumlad in ka badan ma jiree)."
PLG_SYSTEM_JOOA11Y_HEADING_LONG_INFO="Tirada Xarfaha: <strong>%(headingLength)</strong>."
PLG_SYSTEM_JOOA11Y_HEADING_MISSING_ONE="Ciwaanka 1 ayaa maqan. Ciwaanka 1 waa inuu noqdaa bilowga goobta ugu weyn ee nuxurka, wuxuuna yahay ciwaanka ugu weyn ee sharxaya ujeeddada guud ee bogga. Wax ka baro <a href=\"https://www.w3.org/WAI/tutorials/page-structure/headings/\" target=\"_blank\" rel=\"noopener noreferrer\">Qaabka Ciwaanka.</a>"
PLG_SYSTEM_JOOA11Y_HEADING_NON_CONSECUTIVE_LEVEL="Heerka ciwaan ee aan isku xiga ahayn ayaa la isticmaalay. Ciwaanadu waa inay mar walba heerka isku xiga raacaan, ama ka socdaan <strong>Ciwaanka %(prevLevel)</strong> ilaa <strong>Ciwaanka %(level)</strong>."
PLG_SYSTEM_JOOA11Y_HIDE_OUTLINE="Qari Qorshaha"
PLG_SYSTEM_JOOA11Y_HIDE_SETTINGS="Qari Dejinta"
PLG_SYSTEM_JOOA11Y_HYPERLINK_ALT_LENGTH_MESSAGE="Qorista waa wax badan-Alt text sawir isku xidhan waxay ahayd <strong>dheer tahay</strong>. Alt text sawir isku xidhan waa in uu sharaxaa meesha xidhiidhka kuu gaynayo, aan ahaaan sharaxa sawirka. <strong>Tixgeli inaad isticmaasho cinwaanka bogga uu xidhiidho u yahay alt text.</strong>"
PLG_SYSTEM_JOOA11Y_HYPERLINK_ALT_LENGTH_MESSAGE_INFO="Qorista alt wax ayay tahay <strong>%(altLength)</strong> xaraf: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DECORATIVE="Sawirka waxaa loo calaamadeeyey <strong>farshaxan</strong> waxaana iska indho-tiri doona teknoolojiyada caawiye."
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DECORATIVE_INFO="In kasta oo <strong>qoraal</strong> la bixiyey, sawirku waa inuu sidoo kale leeyahay alt text badanaa. <ul><li>Alt text waa inuu bixiyaa sharaxaad kooban oo ku saabsan waxa sawirka ku jira.</li><li>Qoraalku badanaa waa inuu bixiyo macnaha guud si uu u la xidhiidho sawirka nuxurka ku xeeran, ama si uu u iftiimiyo xog gaar ah.</li></ul> Wax dheeraad ah ka baro: <a href=\"https://thoughtbot.com/blog/alt-vs-figcaption#the-figcaption-element\" target=\"_blank\" rel=\"noopener noreferrer\">alt iyo figcaption.</a>"
PLG_SYSTEM_JOOA11Y_IMAGE_FIGURE_DUPLICATE_ALT="Ha isticmaalin ereyada isla midka ah ee loogu talagalay alt iyo qoraalka. Akhristayaasha shaashadda waxay ku dhawaaqi doonaan macluumaadka laba jeer."
PLG_SYSTEM_JOOA11Y_LABELS_ARIA_LABEL_INPUT_MESSAGE="Gelinta waxay leedahay magac la heli karo, qayb ka mid ah fadlan xaqiiji in uu jiro calaamad muuqata oo sidoo kale."
PLG_SYSTEM_JOOA11Y_LABELS_ARIA_LABEL_INPUT_MESSAGE_INFO="Magaca la heli karo ee gelintan waa: <strong>%(ariaLabel)</strong>"
PLG_SYSTEM_JOOA11Y_LABELS_INPUT_RESET_MESSAGE="Badhanka dib u dejinta waa in <strong>aan</strong> loo isticmaalin ilaa ay si gaar ah loo baahan yahay sababtoo ah way fududahay in si qalad ah loo hawlgeliyo."
PLG_SYSTEM_JOOA11Y_LABELS_INPUT_RESET_MESSAGE_TIP="<strong>Talo!</strong> Wax ka baro sababta <a href=\"https://www.nngroup.com/articles/reset-and-cancel-buttons/\" target=\"_blank\" rel=\"noopener noreferrer\">Badhanka Dib-u-dejinta iyo Kansalka ay u soo bandhigaan dhibaatooyinka isticmaalka.</a>"
PLG_SYSTEM_JOOA11Y_LABELS_MISSING_IMAGE_INPUT_MESSAGE="Badhanka sawirka ayaa maqan alt text. Fadlan ku dar alt text si aad magac la heli karo u bixisid. Tusaale ahaan: <em>Raadinta</em> ama <em>Gudbi</em>."
PLG_SYSTEM_JOOA11Y_LABELS_MISSING_LABEL_MESSAGE="Ma jiro calaamad ku xiran gelintan. Fadlan ku dar <span class=\"jooa11y-kbd\">id</span> galintan, oo ku dar <span class=\"jooa11y-kbd\">for</span> attribute u dhiganta calaamadda."
PLG_SYSTEM_JOOA11Y_LABELS_NO_FOR_ATTRIBUTE_MESSAGE="Ma jiro calaamad ku xiran gelintan. Ku dar <span class=\"jooa11y-kbd\">for</span> attribute si uu u dhigmo <span class=\"jooa11y-kbd\">id</span> gelintan."
PLG_SYSTEM_JOOA11Y_LABELS_NO_FOR_ATTRIBUTE_MESSAGE_INFO="ID-da gelintan waa: <strong>id=&#34;%(t)&#34;</strong>"
PLG_SYSTEM_JOOA11Y_LANG_CODE="so"
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_BAD_WORD_MESSAGE="Lagaa helay kordhinta faylka ee qoraalka alt-ka dhexdiisa. Haddii sawirku sheego sheeko, niyad, ama macluumaad muhiim ah - hubi inaad sawirka qeexdo."
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_BAD_WORD_MESSAGE_INFO="Ka saar: <strong>%(error)</strong>.<br>Qoraalka alt-ka ee sawirkan waa: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_SUS_WORD_MESSAGE="Tiknoolajiyada kaalmada horeba waxay tilmaameysaa in kani yahay sawir, sidaa darteed &quot;<strong>%(error)</strong>&quot; ama &quot;%(error) of&quot; waxay noqon karaan wax aan muhiim ahayn."
PLG_SYSTEM_JOOA11Y_LINK_ALT_HAS_SUS_WORD_MESSAGE_INFO="Qoraalka alt-ka ee sawirkan waa: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ALT_PLACEHOLDER_MESSAGE="Waxaa la helay mid aan qeexneyn ama qoraal alt beddelaad ah. Bedel qoraalkan alt-ka ah mid wax macno leh: <strong>%(altText)</strong>."
PLG_SYSTEM_JOOA11Y_LINK_ALT_TOO_LONG_MESSAGE="Qeexitaanka qoraalka alt-ka waa <strong>dheer yahay</strong>. Qoraalka alt-ka waa inuu ahaadaa mid kooban sida <em>ciwaan</em> (qiyaastii 100 xaraf). Haddii tani tahay sawir adag ama garaaf, ka fikir in aad dhigto qeexidda dheer ee sawirka ama mid kaamil ah wahadalka hoose."
PLG_SYSTEM_JOOA11Y_LINK_ALT_TOO_LONG_MESSAGE_INFO="Qoraalka alt-ka wuxuu leeyahay <strong>%(altLength)</strong> xarfo: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_ANCHOR_LINK_AND_ALT_MESSAGE="Xiriirka sawirka wuxuu ka kooban yahay <strong>qoraal alt iyo qoraal dhinaca xiriirka ah iyo alt.</strong> Haddii sawirkan uu yahay mid qurxin ah oo loo isticmaalo xiriir ujeedo u leh bog kale, ka fiirso inaad calaamadiso sawirka sida qurxin - qoraalka xiriirka hareerihiisa ayaa ku filnaan kara."
PLG_SYSTEM_JOOA11Y_LINK_ANCHOR_LINK_AND_ALT_MESSAGE_INFO="Qoraalka alt-ka: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_BEST_PRACTICES="Ka fiirso inaad beddesho qoraalka xiriirka: <strong>%(error)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_BEST_PRACTICES_DETAILS="<ul><li>&quot;Riix halkan&quot; waxay xoogga saaraysaa mashiinka mouse-ka, marka dad badan aysan isticmaalin mouse ama laga yaabo inay ku daawadaan boggan internet-ka mobiil. Tixgeli inaad isticmaasho fal kale oo la xiriira hawsha.</li><li>Ishaaga isticmaalida astaamaha HTML sida wicitaan ficil ah ilaa iyo ay qarsoodi ka yihiin teknoolojiyadda kaalmada.</li></ul>"
PLG_SYSTEM_JOOA11Y_LINK_DECORATIVE_MESSAGE="Sawirku waa calaamadeysan yahay sida <strong>qurxin</strong> oo waxaa iska indhatiraya teknoolojiyada kaalmada. Haddii sawirku sheego sheeko, niyad ama macluumaad muhiim ah - hubi in aad ku darto qoraal alt."
PLG_SYSTEM_JOOA11Y_LINK_EMPTY="Ka saar xiriirrada bannaan ee aan wax qoraal ah ku lahayn."
PLG_SYSTEM_JOOA11Y_LINK_EMPTY_LINK_NO_LABEL="Xiriirku ma leh qoraal lagu garto oo muuqda akhristayaasha shaashadda iyo teknoolojiyada kale ee kaalmada. Si aad u saxo:<ul><li>Kudar qaar ka mid ah qoraal kooban oo qeexaya meesha xiriirka kuu geynayo.</li><li>Haddii uu yahay <a href=\"https://a11y-101.com/development/icons-and-links\" target=\"_blank\" rel=\"noopener noreferrer\">xiriirka astaanta ama SVG</a> waxaa marar badan maqnaada calaamad qiyaas leh.</li><li>Haddii aad u maleyneyso xiriirkan inuu khalad yahay sababo la xiriiro nuqul/qorid bug ah, ka fiirso inaad tirtirto.</li></ul>"
PLG_SYSTEM_JOOA11Y_LINK_HYPERLINKED_IMAGE_ARIA_HIDDEN="Xiriirka ku wareegsan sawirka wuxuu leeyahay <span class=\"jooa11y-kbd\">aria-hidden=&quot;true&quot;</span> balse wali waa la xafidsan karaa furaha kiiboodhka. Haddii aad ku talinayso inaad qariso xiriir aan muhiim ahayn ama nuqul, ku dar <span class=\"jooa11y-kbd\">tabindex=&quot;-1&quot;</span> sidoo kale."
PLG_SYSTEM_JOOA11Y_LINK_IDENTICAL_NAME="Xiriirka ayaa leh qoraal la mid ah sida xiriirka kale, in kastoo ay tilmaameyso bog kale. Xiriirada badan oo leh qoraal la mid ah waxay sababi karaan jahwareer dadka isticmaala akhristayaasha shaashadda."
PLG_SYSTEM_JOOA11Y_LINK_IDENTICAL_NAME_TIP="Ka fiirso inaad ka dhigto xiriirkan mid qeexan si ay u caawiso in loo kala saaro xiriirrada kale: <strong>%(linkText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_BAD_ALT_MESSAGE="Lagaa helay kordhinta faylka ee qoraalka alt-ka dhexdiisa. Hubi in qoraalka alt-ka uu qeexayo meesha xiriirka ku geyneeyo, maaha qeexid saxan oo sawirka. Ka saar: <strong>%(error)</strong>."
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_BAD_ALT_MESSAGE_INFO="Qoraalka alt-ka ee sawirkan waa: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_ALT_TEXT_MESSAGE="Xiriirka sawirka wuxuu leeyahay qoraalka alt, iyadoo fadlan xaqiijiso in qoraalka alt uu qeexo bogga meesha uu xiriirka ku geyneyo. <strong>Ka fiirso inaad isticmaasho ciwaanka bogga uu xiriirka u gudbiyo sida qoraalka alt.</strong> Qoraalka alt-ka ma qeexayaa meesha uu xiriirku kaaga saarayo?"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_ALT_TEXT_MESSAGE_INFO="Qoraalka alt-ka: <strong>%(altText)</strong>"
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_LINK_NULL_ALT_NO_TEXT_MESSAGE="Sawirka ku jira xiriirka waxaa calaamadeysan sida qurxin waxaana jira qoraal xiriir la'aan ah. Fadlan ku dar qoraalka alt-ka ee sawirka oo qeexaya meesha xiriirka ku geyneeyo."
PLG_SYSTEM_JOOA11Y_LINK_IMAGE_PLACEHOLDER_ALT_MESSAGE="Waxaa la helay mid aan qeexneyn ama qoraal alt beddelaad ah oo ku jira sawir xiriir leh. Hubi in qoraalka alt-ka uu qeexo meesha xiriirka ku geyneyo, ma aha qeexid saxan oo sawirka. Bedel qoraalka alt-ku xiga: <strong>%(altText)</strong>."
