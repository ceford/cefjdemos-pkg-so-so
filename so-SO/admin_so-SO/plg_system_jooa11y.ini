PLG_SYSTEM_JOOA11Y_QA_FAKE_HEADING_INFO="Khaddi qoraal xariijimeysan waxa uu u ekaan karaa ciwaan, laakiin qof isticmaala akhristaha shaashadda kama garan karo muhiimada ama uma boodi karo waxa ku jira. Qoraal xariijimeysan kama badali karo ciwaano semantik ah (Ciwaanka 2 ilaa Ciwaanka 6)."
PLG_SYSTEM_JOOA11Y_QA_PAGE_LANGUAGE_MESSAGE="Luuqada bogga lama caddeyn! Fadlan <a href=\"https://www.w3.org/International/questions/qa-html-language-declarations\" target=\"_blank\" rel=\"noopener noreferrer\">ku caddee luqadda HTML tag.</a>"
PLG_SYSTEM_JOOA11Y_QA_PDF_COUNT="PDF-yada waxaa loo arkaa waxyaabaha ku jira webka oo waa in sidoo kale la dhigi karo mid la heli karo. PDF-yada inta badan waxay ka kooban yihiin arrimo dadka isticmaala akhristeyaasha shaashadda (tags akhyaar ah ama calaamado meelo foom la'aan ah oo maqan) iyo dadka daciifka aragga leh (qoraalka ma sii socdo markuu weynaado). <ul><li>Haddii tan ay tahay foom, ka fiirso isticmaalka foom HTML la heli karo sida ikhtiyaar.</li><li>Haddii tan ay tahay dukumiinti, ka fiirso in loo beddelo bogga webka.</li></ul><br>Sidoo kale, fadlan hubi <strong>%(pdfCount)</strong> <a href=\"https://www.adobe.com/accessibility/products/acrobat/using-acrobat-pro-accessibility-checker.html\" target=\"_blank\" rel=\"noopener noreferrer\">PDF(yada) la heli karo ee Acrobat DC.</a>"
PLG_SYSTEM_JOOA11Y_QA_SHOULD_BE_LIST="Ma isku dayaysaa inaad samaysato liis? Waxa laga yaabaa in la helay shayga liiska: <strong>%(firstPrefix)</strong>"
PLG_SYSTEM_JOOA11Y_QA_SHOULD_BE_LIST_TIP="Hubi inaad isticmaasho liisaska semantik adigoo isticmaalaya badhaminta qaabaynta bullet ama lambar beddelkeeda. Markaad isticmaalayso liiska semantik, farsamooyinka kaalmada waa inay awoodaan inay bixiyaan macluumaad sida tirada guud ee walxaha iyo booska ee mid kasta oo kamid ah liiska. Wax badan ka baro <a href=\"https://www.w3.org/WAI/tutorials/page-structure/content/#lists\" target=\"_blank\" rel=\"noopener noreferrer\">liisaska semantik.</a>"
PLG_SYSTEM_JOOA11Y_QA_UPPERCASE_WARNING="Waxa la helay dhammaan warqadaha. Akhristayaasha qaarkood waxay turjumaan dhammaan warqadaha sida calaamado oo akhriyaan xaraf kasta gaar ahaan. Intaa waxaa dheer, dad qaar waxay u arkaan warqadaha oo dhan inay akhrin adag yihiin waxayna u noqon karaan muuqaal qaylo."
