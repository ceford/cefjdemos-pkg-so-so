PLG_QUICKICON_PHPVERSIONCHECK="Asta Sare - Hubinta Nooca PHP"
PLG_QUICKICON_PHPVERSIONCHECK_SECURITY_ONLY="Nooca PHP-gaaga, %1$s, wuxuu kaliya helayaa hagaajin ammaan ee mashaariicda PHP xilligan. Tani waxay la micno tahay in nooca PHP-gaaga aan dhawaan la taageeri doonin. Waxaan kugula talineynaa inaad qorsheyso inaad cusboonaysiiso nooca cusub ee PHP ka hor inta aysan dhamaan taageerada %2$s. Joomla waxay noqon doontaa mid dhaqso leh oo ammaan badan haddii aad cusboonaysiiso nooca cusub ee PHP. Fadlan la xiriir adeeg bixiyahaaga si aad u hesho tilmaamaha cusboonaysiinta."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED="Waxaan ogaannay in server-kaaga uu isticmaalayo PHP %1$s oo ah mid gaboobay waxana aanu saa'id cadaalad taageero amni rasmiga ugu ka naive wax qaabineynise loogama helin. Mashruuca Joomla! waxuu kugula talinayaa inaad cusboonaysiiso goobtaada PHP %2$s ama ka danbeeyay oo heli doona hagaajin amni ugu yaraan ilaa %3$s. <br><br>Fadlan weydii adeeg bixiyahaaga inuu PHP %2$s ama nooc kadib ka dhigto midkaaga asalka u ah goobtaada. Haddii adeeg bixiyahaaga uu mar hore diyaar la yahay ay PHP %2$s fadlan ku qabo PHP %2$s xididdada dadka u yahay 'administrator' – caadiyan waxaad taas isla-aad ku samayn karta qalab ku yaala goleha hagaajinta goobtaada, waana u wanaagsan tahay inaad waydiisato adeeg-bixiyahaaga haddii aadan hubin."
PLG_QUICKICON_PHPVERSIONCHECK_UNSUPPORTED_JOOMLA_OUTDATED="Waxaan ogaannay in server-kaaga uu isticmaalayo PHP %1$s oo ah mid gaboobay waxana aan la isugu fidin hagaajin amni rasmiga ugu soo duubaan waxba uga oogan yahayaaz Abuurtayaasha. Ka dhigayaan waliba wax haboon ma jirto halkan tanna koobtoodani PHP cusub maxaa yeelay waxaad isticmaalaysaa nooc Joomla! oo aan la cusbooneysiin. Waxaan kugula talineynaa inaad cusboonaysiiso Joomla! ka dibna raac tilmaamaha cusub ee PHP."
PLG_QUICKICON_PHPVERSIONCHECK_XML_DESCRIPTION="Waxay eegtaa xaaladda taageerada nooca PHP-ga ee rakibidaada waxayna keentaa digniin haddii aan si buuxda loo taageerin."

