PLG_SYSTEM_WEBAUTHN="Nidaamka - Galitaanka Furaha (Dib-u-gelitaanka)"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="Ma geli kartid ama ka saari kartid furayaasha magaca isticmaale. Isticmaalayaashu waa inay galaan, kuna rakibaan qalabkooda."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="Waxay awoodaysaa aqoonsi la'aanta erayga sirta ah isticmaalka furaha. Fadlan ogow in tabka furayaasha ee tifaftiraha astaanta isticmaale iyo badhannada furayaasha la soo bandhigi doono oo keliya marka isticmaale uu galaya bogga habkaan HTTPS. Diiwaangelinta furayaasha iyo isticmaalka si ay ugu galaan boggaaga waxay ku shaqayn doontaa oo keliya marka boggaaga uu isticmaalayo shahaado sax ah, oo ay saxiixday Waaxda Shahaado ee daalacashada isticmaale ay aaminsan tahay."
PLG_SYSTEM_WEBAUTHN_ERR_AJAX_INVALIDACTION="Hawl nadiifin khalad ah"
PLG_SYSTEM_WEBAUTHN_ERR_CANNOT_FIND_USERNAME="Ma heli karo goobta magaca isticmaale ee qeybta galitaanka. Waan ka xunnahay, aqoonsiga la'aanta erayga sirta ah ma shaqeyn doono boggan ilaa aad isticmaashid module kale oo galitaanka."
PLG_SYSTEM_WEBAUTHN_ERR_CANT_STORE_FOR_GUEST="Ma keydin karo shahaadooyinka isticmaalaha Martida!"
PLG_SYSTEM_WEBAUTHN_ERR_CORRUPT_STORED_CREDENTIAL="Shahaadooyinka la kaydiyay ee xisaabtaada isticmaalaha ayaa waxyeeloobay. Si aad uga gasho hab kale, ka saar kadibna dib ugu dar furahaaga."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Codsi galitaan khaldan oo la'aanta erayga ah. Waxbaa jaban ama tani waa iskuday in website-ka lagu soo jabsado."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_PK="Diiwaangelinta furaha ayaa fashilantay. Jawaabta furaha ee daalacashada ayaa u dhigmi weyday Furaha Dadweynaha ee ay soo saartay server-ka. Tani waxay ka dhigan tahay in qof uu isku dayay inuu ku soo weeraro ama waxbaa jaban."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_USER="Sababaha amniga darteed looma oggola in aad furaha ku diiwaangeliso magaca isticmaal kale."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Waxbaa qaldan laakiin wakhtigan macluumaadka qaladka lagama heli karo. Fadlan isku day mar kale diiwaangelinta furahaaga."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_PK="Server-ka ma soo saarin Fure Dadweyne ee diiwaangelinta furaha laakiin si kastaba ha ahaatee codsi diiwaangelin furaha ka helay daalacadaha. Tani waxay ka dhigan tahay in qof uu isku dayay inuu ku soo weeraro ama waxbaa jaban."
PLG_SYSTEM_WEBAUTHN_ERR_CREDENTIAL_ID_ALREADY_IN_USE="Ma keydin karo shahaadooyinka. Shahaadooyinkaas waxaa horay u isticmaalaya isticmaal kale."
PLG_SYSTEM_WEBAUTHN_ERR_EMPTY_USERNAME="Waa inaad gashaa magacaaga isticmaalaha (laakiin MA AHAN erayga sirta ah) ka hor inta aadan dooran badhanka galitaanka furaha."
PLG_SYSTEM_WEBAUTHN_ERR_INVALID_USERNAME="Magaca isticmaalaha la tilmaamay kuma haboona xisaab isticmaale oo hawlgeliyay galitaanka la'aanta erayga sirta ah ee boggan."
PLG_SYSTEM_WEBAUTHN_ERR_LABEL_NOT_SAVED="Ma keydin karin calaamada cusub"
PLG_SYSTEM_WEBAUTHN_ERR_NOT_DELETED="Ma saari karin furaha"
PLG_SYSTEM_WEBAUTHN_ERR_NOUSER="Xisaab isticmaale lama helin"
PLG_SYSTEM_WEBAUTHN_ERR_NO_BROWSER_SUPPORT="Waan ka xunnahay, daalacadahaagu ma taageeraan heerka furayaasha ee galitaanka la'aanta erayga sirta ah ama boggaaga laguma adeegayo HTTPS oo leh shahaado sax ah, oo ay saxiixday Waaxda Shahaado ee daalacadahaagu ay aaminsan tahay. Waxaad u baahan doontaa inaad ku gasho boggan adigoo isticmaalaya magacaaga isticmaalaha iyo erayga sirta ah."
PLG_SYSTEM_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Lama heli karo shahaadooyinka la kaydiyay ee furahaaga."
PLG_SYSTEM_WEBAUTHN_ERR_USER_REMOVED="Isticmaalaha furaha kani umuuqanayo inuu mar dambe ka jiro boggan."
PLG_SYSTEM_WEBAUTHN_ERR_XHR_INITCREATE="Ma heli karo macluumaadka diiwaangelinta furaha ee boggaaga."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="Kaliya u oggolow furayaasha oo leh saxiixyada kriptografiyada la xaqiijin karo inay ku isticmaalaan galitaanka furaha. Aad ayaa loo soo jeedinayaa deegaannada amniga sare leh. Waxay u baahan tahay liiska ku-meelgaarka ah ee nidaamka in uu yahay mid la qori karo iyadoo la adeegsanayo PHP, iyo kordhinta OpenSSL. Marka ay dhacdo inay joojin karto furayaasha raqiiska ah ee aan shahaado la haynin inay gabi ahaanba shaqeeyaan. Haddii la naafo lagu sameeyo waxay sidoo kale joojineysaa Joomla in laga aqoonsado nooca iyo nooca furaha aad isticmaalayso (astaanta ma noqon doonto mid lagu muujiyo magaca furaha agtooda)."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_LABEL="Taageerada Aqoonsiga"
PLG_SYSTEM_WEBAUTHN_FIELD_DESC="Waxay kuu oggolaaneysaa inaad maamusho hababka galitaanka la'aanta erayga sirta ah adoo isticmaalaya furayaasha. Waxaad u baahan tahay daalacadaha taageeraya iyo fure (tusaale Google Chrome ama Firefox oo leh fure FIDO2 shahaado la haysto).<br><br><strong>MacOS/iOS/watchOS:</strong> Aqoonsiga tallaabo/ido.<br><strong>Windows:</strong> Hello (Aqoonsiga faraha / Aqoonsiga wajiga / PIN).<br><strong>Android:</strong> Quful shaashadda baayooloji.<br><br>Waxaad ka heli kartaa faahfaahin dheeraad ah <a href=\"https://docs.joomla.org/Special:MyLanguage/WebAuthn_Passwordless_Login\" target=\"_blank\" rel=\"noopener noreferrer\">Dukumentiyada Galitaanka Furaha la'aanta</a>."
