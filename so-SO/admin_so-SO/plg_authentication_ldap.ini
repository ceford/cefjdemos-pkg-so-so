PLG_LDAP_FIELD_UID_DESC="Astaanta LDAP oo leh Aqoonsiga Isticmaalaha ee Login ID. Wixii Active Directory tan waa sAMAccountName."
PLG_LDAP_FIELD_UID_LABEL="Midhilka: Aqoonsiga Isticmaalaha"
PLG_LDAP_FIELD_USERNAME_DESC="Furaha Isku Xirka ee Isku Xirka iyo Furaha Isku Xirka waxay qeexayaan halbeega isku xidhka ee marxaladda baarista DN. Laba ikhtiyaar ayaa jira: baarista DN aan la qarin (Labada goobood ka tag oo bannaan) iyo isku xirnaanta maamulka (Furaha Isku Xirka waa magaca isticmaale ee akoonka maamulka, tusaale ahaan Maamule). Kaliya loo isticmaalo habka Xidhiidhka iyo Raadinta."
PLG_LDAP_FIELD_USERNAME_LABEL="Magaca Isticmaalaha ee Isku Xirka"
PLG_LDAP_FIELD_USERSDN_DESC="Erayga [username] si firfircoon ayaa loo bedelay sida Login-ka uu isticmaale bixiyo. Tusaale xarriiq ah waa: uid=[username], dc=my-domain, dc=com. Xadhko dhowr ah ayaa la isticmaali karaa, oo kala soocan semikolooyaal. Kaliya waxaa loo isticmaalaa habka Xiriir Toos ah sida Isticmaale."
PLG_LDAP_FIELD_USERSDN_LABEL="DN-ka Isticmaalaha"
PLG_LDAP_FIELD_V3_DESC="Muuqaalka caadiga ah waa LDAP2, laakiin noocyada ugu dambeeyay ee OpenLdap waxay dalbanayaan macaamiisha inay isticmaalaan LDAPV3."
