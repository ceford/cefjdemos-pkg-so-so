PLG_LDAP_FIELD_SEARCHSTRING_DESC="Xadhko weyddi ah oo loo isticmaalo in lagu raadiyo Isticmaale la siiyay. Erayga [search] waxaa si firfircoon u beddela taageeraha login-ka ee Isticmaalaha. Xadhko tusaale ah waa: uid=[search]. Xargo badan ayaa loo adeegsan karaa oo lagu dhexyaaciyey fiiq. Waxa loo isticmaalaa ka dib markii horay loogu xidho dhammaan hababka."
