PLG_SYSTEM_SHORTCUT_XML_DESCRIPTION="<p>Waxay suuragelinaysaa furfurnaanta keyboard-ka ee goobta maamulka, taas oo lagu bixin kara qalabyo kale waxayna toos ugu jirtaa liiskan furfurnaanta soo socda:</p><ul class=\"list-unstyled\"><li><kbd>J</kbd> <small>ka dibna</small> <kbd>A</kbd> Kaydi</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>S</kbd> Kaydi & Xidh</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>Q</kbd> Jooji</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>N</kbd> Cusub</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>F</kbd> Raadi</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>O</kbd> Xulashooyinka</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>H</kbd> Caawimaad</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>M</kbd> Dalka Menu</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>X</kbd> Guudmar</li><li><kbd>J</kbd> <small>ka dibna</small> <kbd>D</kbd> Dashboard-ka Guriga</li></ul>"

