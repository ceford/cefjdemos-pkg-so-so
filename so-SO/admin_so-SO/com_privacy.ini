COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="Maamule u ah {URL} ayaa sameeyay codsi lagu dhoofinayo macluumaadka isku xiraya cinwaankan iimaylka. Si loo hubiyo nabadgelyada, waa inaad xaqiijisaa in tani ay tahay codsi ansax ah oo ku saabsan macluumaadkaaga shakhsiyeed ee ka yimid boggan.\n\nHaddii tani ahayd qalad, iska dhaaf iimaylkan waxna ma dhici doonaan.\n\nSi aad ugu xaqiijiso codsigan, waxaad dhamaystiri kartaa mid ka mid ah hawlahan soo socda:\n\n1. Booqo URL-ka soo socda: {TOKENURL}\n\n2. Koobi token-kaaga iimaylkan, booqo URL-ka loo tilmaamay, oo dhaji token-kaaga foomka.\nURL: {FORMURL}\nToken: {TOKEN}\n\nFiiro gaar ah u yeelo in token-kan uu ansax yahay oo keliya 24 saacadood laga bilaabo markii iimaylkan la diray."
COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_REMOVE_REQUEST="Maamule u ah {URL} ayaa sameeyay codsi lagu saarayo dhammaan macluumaadka shakhsiyeed ee ku xiriira cinwaankan iimaylka. Si loo hubiyo nabadgelyada, waa inaad xaqiijisaa in tani ay tahay codsi ansax ah oo ku saabsan macluumaadkaaga shakhsiyeed in laga tirtiro boggan.\n\nHaddii tani ahayd qalad, iska dhaaf iimaylkan waxna ma dhici doonaan.\n\nSi aad ugu xaqiijiso codsigan, waxaad dhamaystiri kartaa mid ka mid ah hawlahan soo socda:\n\n1. Booqo URL-ka soo socda: {TOKENURL}\n\n2. Koobi token-kaaga iimaylkan, booqo URL-ka loo tilmaamay, oo dhaji token-kaaga foomka.\nURL: {FORMURL}\nToken: {TOKEN}\n\nFiiro gaar ah u yeelo in token-kan uu ansax yahay oo keliya 24 saacadood laga bilaabo markii iimaylkan la diray."
