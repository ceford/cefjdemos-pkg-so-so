COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="Macluumaadka shaashaddan waxaa laga soo ururiyey kordhinta kuwaas oo soo sheegaya awoodahooda la xiriira asturnaanta nidaamkan. Waxaa loogu talagalay in ay ku caawiso mulkiilayaasha goobaha in ay ka warqabaan awoodaha kordhinta lagu rakibay oo ay bixiyaan macluumaad si ay uga caawiyaan mulkiilaha abuurista siyaasad maqaal oo maxalli ah sida siyaasadda asturnaanta. Maadaama shaashaddan ay u baahan tahay kordhinta si ay u taageerto nidaamka soo sheegida, kuna soo bandhigto kaliya macluumaadka kordhinta furan, tani waa in aan loo tixgelin liis dhammaystiran oo lagugu dhiirrigeliyaa inaad la tashato dukumenti kasta kordhintiisa si aad u hesho macluumaad dheeraad ah."
