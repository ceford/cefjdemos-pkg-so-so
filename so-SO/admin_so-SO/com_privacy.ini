COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="Marka xiriir shabakad la heli karo, rakibaada Joomla waxay isku dayi doontaa inay la xiriirto seerfarada joomla.org ee awoodo kala duwan, si ay ugu jirto:<ul><li>Hubinta cusboonaysiinta codsiga Joomla</li><li>Shaashadaha caawinta ee kordhinaya Joomla aasaasiga ah</li><li>Adeegga Rakibaada shabakad ka ah (ikhtiyaari)</li><li>Seerfarada ururinta istatistikada (ikhtiyaari)</li></ul>Sida dhammaan codsiyada HTTP, ciwaanka IP ee seerfaradaada waxaa lagu gudbin doonaa codsiga qeybtiisa. Wixii macluumaad ah ee ku saabsan sida Joomla u farsameyso xogta seerfaradiisa, fadlan eeg <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">shuruucda gaarka ah</a>."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Nidaamka diiwaangelinta ee Joomla wuxuu diiwaangeliyaa ciwaanka IP ee booqdaha kaasoo keena in fariin loo diiwaangaliyo faylasha diiwaanka. Faylasha diiwaanka waxaa loo isticmaalaa in lagu diiwaangeliyo hawlaha kala duwan ee goobta Joomla, oo ay ku jiraan macluumaadka ku saabsan cusboonaysiinta aasaasiga ah, isku dayada galitaanka khaldan, khaladaad la maareyn karin, iyo macluumaadka horumarinta sida adeegsiga APIs horey loo isticmaalay. Qaabka faylasha diiwaanka waxaa la habeyn karaa kordhinta kasta oo yaqaan logger, sidaas darteed waxaa lagu dhiirrigelinayaa inaad soo dejiso oo dib u eegto faylasha diiwaanka ee boggaaga internetka oo laga heli karo `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Dhammaan codsiyada websaytk Joomla waxay bilaabaan fadhiyo oo kaydiya ciwaanka IP ee xogta fadhiga waxayna abuuraan kuki-fadhiye dhinaca daalacashada isticmaale. Ciwaanka IP waxaa loo isticmaalaa tallaabo amni ahaan si ay ka caawiso in laga ilaaliyo weeraryada dhacdada fadhiga suurtogalka ah tanina waxay tirtirantaa marka fadhigu ku dhammaado xogtiisii la nadiifiyo. Magaca kukika fadhiga waxaa laga sameeyey hash si aan kala sooc lahayn loo abuuro sidaas darteed ma laha aqoonsi joogto ah. Kuki fadhigeed waa la baabi'inayaa marka fadhiga dhaco ama isticmaaluhu ka baxo daalacashadooda."
