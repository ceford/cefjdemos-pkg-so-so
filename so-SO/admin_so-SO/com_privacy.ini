COM_PRIVACY_POSTINSTALL_BODY="<p>Wixii la xiriira soo bandhigidda GDPR ee muwaadiniinta EU iyo xeerar la mid ah meelaha kale ee adduunka waxaa laga yaabaa inay lama huraan tahay inaad codsato oggolaansho ka hor inta aan la kaydin wax kasta oo <strong>Macluumaadka Shaqsiga ah</strong> ee isticmaalaha.</p><p>Joomla 3.9 waxay soo bandhigaysaa kartiyo cusub si ay kaa caawiyaan inaad abuurto siyaasad sirta ah oo goobta ah oo aad ururiso oggolaanshaha isticmaalaha. Intaa waxaa dheer, nidaam hawshu waa diyaar si ay kuu caawiso inaad maamusho codsiyada macluumaadka isticmaale sida codsiyada saaridda xogtooda shakhsiyeed ee boggaaga.</p><p>Wixii macluumaad dheeraad ah ee ku saabsan astaantan cusub akhri <a href='https://docs.joomla.org/Special:MyLanguage/J3.x:Privacy' target='_blank' rel='noopener noreferrer'>Dukumentiga Sirta</a>.</p>"
