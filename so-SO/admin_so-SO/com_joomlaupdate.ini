COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p>Joomla ma xiriiri karto feylka <code>administrator/components/com_joomlaupdate/extract.php</code> kaas oo fulinaya cusbooneysiinta. Tani badiyaa waxay dhacdaa mid ka mid ah sababaha soosocda:</p><ul><li>Feylka qaabeynta serverka ee aasaaska boggaaga, sida <code>.htaccess</code> ama <code>web.config</code>, ayaa xannibaya gelitaanka faylkan.</li><li>Qaabeynta serverkaaga ayaa xannibaya gelitaanka faylkan.</li><li>Milkiyada iyo rukhsadaha faylkan ma oggola serverkaaga in uu galo faylkan.</li><li>Boggaaga wuxuu ku hoos jiraa load balancer ama CDN laakiin qaabeyntiisa ma ogola gelitaanka faylkan mana xannibayso diridda amarada ay u dirto</li><li>In kasta oo faylka la geli karo haddana diridda amarrada oo loogu diro waxaa xanibaaya ilaalinta serverkaaga sida mod_security2.</li></ul><p>Haddii aadan hubin fadlan la xiriir martidaada.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p>Joomla Update ma xiriiri karo sax ahaan waxayna la jirtaa <code>administrator/components/com_joomlaupdate/extract.php</code> taa oo fulinaysa cusbooneysiinta. Tani badiyaa waxay dhacdaa mid ka mid ah sababaha soosocda:</p><ul><li>Feylka <code>administrator/components/com_joomlaupdate/update.php</code>, oo wata tilmaamaha loogu talagalay fulinta cusbooneysiinta, ma abuuri karaan tusaale ahaan sababo rukhsad la xiriira awgood.</li><li>Feylkan kore looma akhriyi karo iyadoo <code>extract.php</code> script ay sabab u tahay rukhsadaha.</li><li>Burreyserkaaga, qalabkaaga shabakadda ama serverkaaga ayaa musuqmaamusay ereyga sirta ah ee aan dirnay codsi kasta oo loogu talagalay <code>extract.php</code> sababo nabadgelyo awgood</li></ul><p>Fadlan isku day inaad u isticmaasho browser kale, oo aan lahayn wax plugins hoolan, ideal ahaan kombuyuutar kale oo ku xiran internet-ka isagoo adeegsanaya bixiye kale. Haddii qaladku sii jiro waxaad la xiriiri kartaa martidaada.</p>"
