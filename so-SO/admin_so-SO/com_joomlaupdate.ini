COM_JOOMLAUPDATE_UPDATE_FAILED_MAIL_BODY="Emaylkan MA AHAN mid loo soo diray mashruuca Joomla! Waxay si toos ah u soo dirtay goobtaada,\n{SITENAME} - {URL} \n\n================================================================================\nMACLUUMAADKA CUSUB\n================================================================================\nGoobtaada looma cusbooneysiin karin laga bilaabo {OLDVERSION} ilaa {NEWVERSION}.\nFadlan eeg log file '/administrator/logs/joomla_update.php' macluumaadka debugging faahfaahsan.\nE-maylkani waxaa ku soo diri goobtaada.\nMashruuca Joomla! waligiis si toos ah kuguma soo xiriiri doono.\n================================================================================\nMAXAY TAHAY EMAYLKAN KA HELAYA?\n================================================================================\nEmaylkani waxaa si toos ah u soo diray Joomla!, oo ah software-ka awood leh goobtaada.\nWaxaad shidday cusbooneysiinta tooska ah ee goobtaada iyo iskuday inaad rakibto cusbooneysi noocan oo kale ah waxay kicisaa farriintan.\nHaddii aadan fahmin waxa ay tahay Joomla! iyo waxa aad u baahan tahay inaad sameyso fadlan ha la xiriirin mashruuca Joomla!.\nMaaha iyaga kuwa kuu soo diraya emailkan mana awoodaan inay ku caawiyaan. Halkii, fadlan la xiriir qofka dhisay ama maamulo goobtaada.\n================================================================================\nYAAY IGU SOO DIRAY EMAYLKAN?\n================================================================================\nE-maylkani waxaa loo soo diray adiga oo leh goobtaada, {SITENAME}"
