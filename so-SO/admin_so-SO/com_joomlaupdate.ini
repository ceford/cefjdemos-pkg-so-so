COM_JOOMLAUPDATE_VIEW_UPLOAD_CAPTIVE_INTRO_BODY="Hubi in faylka cusboonaysiinta aad soo gudbisay uu ka yimid bogga rasmiga ah ee soo dejinta Joomla. Kadibna, fadlan xaqiiji inaad rabto inaad rakibto adigoo dib u gelaya xogta galka boggaaga &quot;%s&quot; hoos ku xusan."
