COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_DOWNGRADE="Faylka baakadka la soo gudbiyay \"%1$s\" wuxuu leeyahay nooc hoose \"%2$s\" marka loo eego nooca la rakibay \"%3$s\". Ma hoos u dhigi kartid goobta Joomla.<br>Hubi <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">bogga rasmiga ah ee soo dejinta Joomla</a> si aad u hesho Baakad Cusboonaysiis ah oo <em><strong>nooc cusub</strong></em> ka tirsan."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_INSTALL_PACKAGE="Faylka baakadka la soo gudbiyay \"%s\" wuxuu u eg yahay baakada rakibaadda buuxda ee Joomla oo kaliya loo isticmaali karo si loo abuuro goobo cusub. Kaliya waxaa lagu isticmaali karaa <em><strong>Baakad Cusboonee</strong></em> si aad u cusboonaysiiso boggaaga.<br>Hubi <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">bogga rasmiga ah ee soo dejinta Joomla</a> si aad u hesho Joomla <em><strong>Baakad Cusboonee</strong></em> oo nooca saxda ah ah."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_NO_MANIFEST_FILE="Faylka baakadka la soo gudbiyay \"%s\" ma aha baakad cusboonaysiin Joomla. Kuma jiraan faylka \"administrator/manifests/files/joomla.xml\".<br>Hubi <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">bogga rasmiga ah ee soo dejinta Joomla</a> si aad u hesho Joomla <em><strong>Baakad Cusboonee</strong></em> oo sax ah."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_NO_VERSION_FOUND="Faylka baakadka la soo gudbiyay \"%s\" ma aha baakad cusboonaysiin Joomla. Ma uusan qaban macluumaad nooc sax ah.<br>Hubi <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">bogga rasmiga ah ee soo dejinta Joomla</a> si aad u hesho Joomla <em><strong>Baakad Cusboonee</strong></em> oo sax ah."
COM_JOOMLAUPDATE_VIEW_UPLOAD_ERROR_PACKAGE_OPEN="Faylka baakadka la soo gudbiyay \"%s\" maaha fayl ZIP ama wuu fashilmay.<br>Hubi <a class=\"alert-link\" href=\"https://downloads.joomla.org/latest\" target=\"_blank\" rel=\"noopener noreferrer\">bogga rasmiga ah ee soo dejinta Joomla</a> si aad u hesho Joomla <em><strong>Baakad Cusboonee oo ah Qaabka ZIP</strong></em> ee la rabo."
