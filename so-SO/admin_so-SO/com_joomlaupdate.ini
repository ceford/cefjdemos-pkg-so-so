COM_JOOMLAUPDATE_CONFIG_AUTOMATED_UPDATES_DESC="Cusboonaysiinta otomaatiga ah waxay helaan oo keliya goobaha lagu heli karo si madax bannaan internetka. Haddii goobtaada ay ka dambeyso gidaarka dabka ama aan lagu heli karin si qaas ah, sida deegaan tijaabo gudaha ah, waxaad u baahan tahay inaad gacanta ku cusbooneysiiso.<br><br><strong>Fadlan ogow:</strong> taageerida Cusboonaysiinta Otomaatiga ah waxay diiwaangelisaa goobtaada adeegga ku habboon ee uu bixiyo mashruuca Joomla!<br>Diiwaanngelinta waxay u oggolaataa mashruuca Joomla inuu helo macluumaad ku saabsan goobtaada iyo deegaankaada server-ka, gaar ahaan URL-ka Goobta, Nooca PHP, Nooca iyo nooca Dabatabaska, nooca CMS iyo nooca iyo OS-ka server-ka.<br>Macluumaadkan waxaa loo isticmaalaa oo keliya in lagu hagaajiyo adeegga."
