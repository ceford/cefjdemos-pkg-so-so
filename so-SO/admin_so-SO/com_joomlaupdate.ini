COM_JOOMLAUPDATE_VIEW_DEFAULT_UPLOAD_INTRO="Waad isticmaali kartaa sifooyinkan si aad ugu cusboonaysiiso Joomla haddii server-kaaga uu ku jiro gidaarka dabka ama aanad awoodin inaad la xiriirto server-yada cusboonaysiinta. Marka hore soo dejiso Joomla <em><strong>Xirmada Cusboonaysiinta</strong></em> qaabka ZIP-ka ah laga bilaabo <a class='alert-link' href='%s' target='_blank' rel='noopener noreferrer'>bogga rasmiga ah ee dadka soo dagsada Joomla</a>. Ka dibna isticmaal meelaha hoose si aad ugu dhigto oo aad u rakibto."
