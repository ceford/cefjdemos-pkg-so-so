COM_JOOMLAUPDATE_UPDATE_SUCCESS_MAIL_BODY="Email kani MA AHA mid la soo diro mashruuca Joomla! Waxaa si otomaatig ah u diraya goobtaada,\n{SITENAME} - {URL} \n\n================================================================================\nMACLUUMAADKA CUSBOONAYSIINTA\n================================================================================\nBoggaaga si guul leh ayaa si otomaatig ah loogu cusbooneysiiyay laga bilaabo {OLDVERSION} ilaa {NEWVERSION}.\nFadlan hubi goobtaada khaladaad aan la fileyn ama dhibaatooyin.\nEmail kani waxaa kuu soo diray goobtaada.\nMashruuca Joomla! marna kuguma soo xiri doono si toos ah.\n================================================================================\nMAXAAN KU HELAY EMAILKAN?\n================================================================================\nEmailkan waxaa si otomaatig ah u soo diray Joomla!, software-ka ku shaqeeya boggaaga.\nWaxaad karti-gelisay cusbooneysiinta otomaatiga ah ee goobtaada iyo rakibaadda cusboonaysiintan waxay keentaa fariintan.\nHaddii aadan fahmin waxa Joomla! tahay iyo waxa aad u baahan tahay inaad sameyso fadlan ha la soo xiriirin mashruuca Joomla!.\nMarnaba kuguma soo diraan emailkan mana kaa caawin karaan. Halkii aad kan kala xiriiri lahayd cidda boggaaga dhistay ama maamusha.\n================================================================================\nYAA ISOO DIRAY EMAILKAN?\n================================================================================\nEmailkan waxaa kaa soo diray goobtaada, {SITENAME}"
