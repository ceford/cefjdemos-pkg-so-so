PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p>Hab-socodku waxay maamulaan heerarka maqaaladaadu ay tahay inay maraan ilaa ay la daabaco.</p><p>Qaybta lagu maamulo hab-socodka looma dhigo inay firfircoon tahay asalka.</p><p>Si aad u aragto hab-socodka aan bixinnay oo leh xogta muunada ah, marka hore waxaad u baahan tahay inaad shaqeysiiso hawshan.</p><ol><li>Geli goobta maamulka</li><li>"Maadada" > "Qoraallada" > "Xulashooyinka" > tabta 'Isdhexgalka' waxay u dejiyaan 'Howsha socodka' ama 'Haa'</li><li>Keydso isbeddelada</li></ol><p>Hadda marka aad dib u gasho "Maadada" waxaad arki doontaa qaybta 'Hab-socodyada'.</p><p>Marka aad tafatirto maqaalo waxaad sidoo kale arki doontaa isbeddelka cusub ee maqaalaha la xiriira hab-socodyada.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_TITLE="Hab-socodka"
