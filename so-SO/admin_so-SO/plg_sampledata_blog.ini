PLG_SAMPLEDATA_BLOG="Tusaale Xogta Cassiopeia (Blog)"
PLG_SAMPLEDATA_BLOG_OVERVIEW_DESC="Tusaale xogta oo ku diyaarin doonta goob blog ah oo leh qoraallo, tagyo, meeloyin gaar ah iyo hab-socod.<br>Haddii goobta ay tahay mid luqado badan, xogta waa la xiri doonaa luqadda firfircoon ee cidhif dhexe."
PLG_SAMPLEDATA_BLOG_OVERVIEW_TITLE="Tusaale Xogta Blog"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_INTROTEXT="<p>Tani waxay kuu sheegaysaa wax yar oo ku saabsan blogkan iyo qofka qoraya.</p><p>Marka aad soo gasho waxaad awoodi doontaa inaad wax ka beddesho boggan adoo xulanaya astaanta wax ka beddelka.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_0_TITLE="Ku saabsan"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_INTROTEXT="<p>Halkan waxaa ku jira talooyin aasaasi ah oo ku saabsan ka shaqeynta goobtaada.</p><ul><li>Joomla! waxay leedahay 'qayb hore' oo aad imika aragtid iyo 'maamul' ama qeyb dambe oo halkaas aad ka samayso shaqada hore sida diyaarinta menu-yada iyo go’aaminta waxyaabaha la soo bandhigo. Waxaad u baahan tahay inaad galiso si gooni ah adoo isticmaalaya magaca isticmaale iyo eray sir ah oo aad u isticmaashay inaad soo gasho qaybta bogga.</li><li>Mid kamid ah shaqooyinka ugu horreeya ee laga yaabo inaad qabato waa inaad bedesho cinwaanka goobta iyo heerka astaanta oo aad ku darto logo. Si aad tan u sameyso xulo xiriirka Template Settings ee menu-ga oo muuqda haddii aad soo gashay. Inta badan ikhtiyaarada qaabeynta sare waxay heli karaan gudaha maamulaha.</li><li>Si aad gabi ahaanba u bedesho muuqaalka goobtaada waxaa laga yaabaa inaad rabto inaad rakibto template cusub. Tag nidaamka, xulo rakib - Kordhiyayada liiska oo rakibaha kordhiyayada wuu furi doonaa. Waxaa jira tarjumaado badan oo free ah iyo kuwa ganacsi ee Joomla.</li><li>Sidaad hore u aragtay, waxaad xakameyn kartaa cidda arki karta qaybaha kala duwan ee goobtaada. Markaad ka shaqeynayso mashaariic iyo maqaallo, dejinta heerka Helidda sida Loo diiwaan galiyay waxay ka dhigan tahay in isticmaale soo galay oo kaliya uu arki karo.</li><li>Markaad abuurto maqaal cusub ama nooc ka mid ah waxyaabaha kale waxaad sidoo kale ku kaydin kartaa iyadoo la daabacay ama aan la daabicin. Haddii aan la daabacin booqdayaasha goobta lagama arki karo laakiin adiga waa inaad sameysaa.</li><li>Waxaad wax badan ka baran kartaa ka shaqeynta Joomla ee <a href=\"https://docs.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">goobta dukumentiga Joomla</a> iyo helitaanka caawimaad ka timid isticmaalayaasha kale ee <a href=\"https://forum.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Madasha Joomla</a>. Gudaha maamulka waxaa jira badhamada caawinta bog kasta oo bixiya macluumaad faahfaahsan oo ku saabsan hawlaha boggaas.</li></ul>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_1_TITLE="Ka shaqeynta goobtaada"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_10_FULLTEXT=""
