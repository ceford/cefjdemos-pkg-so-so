PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROIMAGE_ALT="Galaxiga Cajiibka Andalus"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p>Tani waa qoraalka tusaale ah ee blog.</p><p>Haddii aad soo gasho goobta (Xirirka Soo-galka Maamulka ayaa ku qoran hoosaan boggan) waxaad awoodi doontaa inaad wax ka beddesho iyo dhammaan maqaallada kale ee jira. Waxaad sidoo kale awoodi doontaa inaad abuuro maqaal cusub iyo inaad sameyso isbeddelo kale oo goobta ah.</p><p>Markaad ku kordhiso oo aad ku hagaajiso maqaallada waxaad arki doontaa sida goobtaadu u beddelato iyo sidoo kale sida aad u habeyn karto siyaabo kala duwan.</p><p>Sii soco, ma jabin kartid.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="Ku soo dhowow blog-gaga"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FIELD_0="Cagaarasho shabatine radish hunis ee hubsan uurnip cagaarka amaranth spinicha biyaha avocado daikon napa cabbage asparagus jiilaalka purslane kale."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>Bogga buuxa waxaad arki doontaa labadaba waxyaabaha hordhac ah iyo inta kale ee maqaalka. Waxaad bedeli kartaa dejimaha si aad uga qarisid horgalka haddii aad rabtid.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p>Boggaaga guriga wuxuu dejisan yahay inuu soo bandhigo afarta qoraalka ugu danbeeyey ee qaybta blog-ka hal toosan. Markaas waxaa jira xiriirinta laba maqaallada ugu da'da weyn kuwii la soo dhaafay. Waxaad bedeli kartaa lambarradaas adoo wax ka beddelaya xulashooyinka waxyaabaha ee tabka blog-ka ee maamulaha goobtaada. Waxaa jira xiriirinta maamulka goobtaada haddii aad soo gashay.</p><p>Haddii aad rabto inaad maqaalkaaga blog loo kala jaro labo qaybood, hordhac ka dibna bog dherer buuxa oo gooni ah, u adeegso midka Akhri In Ka Badan span si aad u geliso dhismo.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="Ku saabsan boggagaaga guriga"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXTIMAGE_ALT="Crab Nebula"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p>Goobtaada waxay leedahay mashaariicyo caadi ah oo hore loogu sii diyaariyay. Kuwani waxaa ka mid ah:</p><ul><li>Sawir (nooca: Gaarka ah), kaas oo haysta sawirka hoosta xariirka. Tani waa mashruuc gaar ah oo aad wax ka beddeli karto si aad u beddesho sawirka.</li><li>Tagyo caan ah (nooca: Tagyada - Caan ah), kaas oo soo biiqan doona haddii aad isticmaasho taggitaanka qoraalladaada. Geli targo xagga dhulka Tagyada markaad wax ka gudbiso.</li><li>Qoraallada Xiirsan (nooca: Qoraallada), kaas oo soo liisan doono qoraallada iyadoo loo qaybiyey qaybaha.</li><li>Iskoorinta (nooca: Dariiqa Iskoorinta), taas oo u ogolaanaysa akhristayaashaada in ay akhriyaan maqaalladaada sida akhri wargays.</li><li>Foomka Soo-galka (nooca: Soo-gal), taas oo u ogolaanaysa isticmaalayaashaada inay galaan qaybaha xaddidan ee shabakadda.</li></ul><p>Mid kasta oo ka mid ah mashaariicdaan waxay leedahay doorashooyin badan oo aad ku tijaabin karto Maareeyaha Mashaariicyada ee maamulaha goobtaada. Markaad soo gasho waxaad sidoo kale dooran kartaa astaanta saxda ee geeska sare taas oo kuu qaadi doonto shaashada gudbinta ee mashruuca. Had iyo jeer qaado oo xidh mashruuc kasta oo aad wax ka beddesho.</p><p>Joomla! sidoo kale waxaa ku jira mashaariicyo kale oo badan oo aad ku dari karto goobtaada. Marka aad horumarinayso goobtaada waxaa laga yaabaa inaad rabto inaad ku darto mashaariico kale oo aad ka heli karto <a href=\"https://extensions.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Liiska Kordhinta Joomla.</a></p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="Mashaariicdaada"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_FULLTEXT=""
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p>Qaab-dhismeedyadu waxay xakameeyaan muuqaalka iyo dareenka shabakaddaada.</p><p>Boggan wuxuu la socdaa qaabka Cassiopeia.</p><p>Waxaad wax ka beddeli kartaa xulashooyinka adigoo dooranaya Ka shaqeynta Boggaaga, Xiriirka Dejinta Qaabka ee liiska kasoo muuqda markaad gasho.</p><p>Tusaale ahaan waxaad beddeli kartaa midabka asalka bogga, midabka iftiinka, cinwaanka bogga, sharraxaadda bogga iyo halka cinwaan ee la isticmaalo.</p><p>Xulashooyin dheeraad ah ayaa laga heli karaa maareeyaha shabakadda. Waxaad sidoo kale ku rakibi kartaa qaabka cusub adoo isticmaalaya maamulaha kordhinta.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="Qaabkaaga"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_FULLTEXT="<p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est</p>"
