COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_DESCRIPTION="<h1 class=\"fw-medium\">Ku soo dhawoow Joomla 5.3!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Cusbooneysiinta Dalxiisyada Hagidda</h2><p>Dalxiis Hagid hadda wuxuu leeyahay API u gaar ah. <a href=\"https://manual.joomla.org/docs/next/web-services-api/\" target=\"_blank\" rel=\"noopener noreferrer\">Dukumentiga API Joomla</a></p><p>La soco hagaajino cusub oo kale oo soo socda dhawaan!</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_3/filesdirectory.jpg\" alt=\"Talaabada ugu horeysa ee soo dhaweeyaha, oo tuseysa galka cusub ee faylalka warbaahinta\" width=\"521\" height=\"304\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Cusbooneysiinta Asaasiga</h2><h3 class=\"mb-3\">Habee Faylalka Meelaha Laga Hebeeyo</h3><p>Hadda waxaad arki kartaa oo xulan kartaa dukumentiyadaada la keydiyay/la soo diray si toos ah oo ka yimid Maareeyaha Media. Ka hel macluumaad dheeraad ah <a href=\"https://magazine.joomla.org/all-issues/december-2024/document-uploads-on-your-joomla-website\" target=\"_blank\" rel=\"noopener noreferrer\">Wargeys Joomla Community</a>.</p><h3 class=\"mb-3\">Eeg Taariikhda Shaqooyinka Jadwalka ah</h3><p>Hadda waxaad awood u leedahay inaad aragto macluumaadka fulinta si toos ah gadaal gadaasha adigoon u baahnayn inaad gasho faylalka log. Raadi badhanka <strong>Taariikhda Fulinta</strong> ee ku yaala bogga Shaqooyinka Jadwalka ah.</p><h3>Hagaajino kale iyo Xalal</h3><ul class=\"mb-3\"><li>Isbarbardhigga Dusha Sare Qaabka Daboolista - waxay ku dareysaa shaqada isbarbardhigga ee dusha sare qaabka daboolida</li><li>La hagaajiyay Raadinta Tag Alias - hadda halkii la tusin lahaa lambarka tag id ee URLka magaca tag ayaa la tusinayaa</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_TITLE="Maxaa Cusub ee Joomla 5.3!"

