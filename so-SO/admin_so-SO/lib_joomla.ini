JLIB_RULES_SETTING_NOTES="Haddii aad beddesho dejinta, waxay saameyn doontaa kooxdan iyo dhammaan kooxaha hoosaadka, qaybaha iyo nuxurka. Ogow in <em><strong>Diidnay</strong></em> ay ka sarreyn doonto dejin kasta oo la dhaxlay iyo sidoo kale dejinta koox kasta, qayb ama nuxur. Marka ay dhacdo isku dhac dejinta, <em><strong>Diid</strong></em> ayaa qaadi doonta mudnaanta. <em><strong>Lama Dejiyo</strong></em> waa u dhigmaa <em><strong>Diidday</strong></em> laakiin waa la beddeli karaa kooxaha hoosaadka, qaybaha iyo nuxurka."
JLIB_RULES_SETTING_NOTES_ITEM="Haddii aad beddesho dejinta, waxay saameyn doontaa shaygan. Ogow in:<br><em><strong>Dhaxleed</strong></em> ay la micno tahay in oggolaanshaha habaynta guud, kooxda waalidka iyo qaybta la isticmaali doono.<br><em><strong>Diidday</strong></em> waxay la micno tahay in wax kasta oo xaaladda habaynta guud, kooxda waalidka ama qeybta ahaan, aanay kooxda la beddeley xubin ahaan ka qaban karin falalkan shaygan.<br><em><strong>Sida Taagan</strong></em> waxay la macno tahay in kooxda la beddeley Xubin ahaan ay awoodi doonto inay sameyso falalkan shaygan (laakiin haddii taasi waddo iska hor imaad habaynta guud ama kooxda waalidka ama qaybta ama ayna wax saamayn ah qaadan doonin; isku dhac waxa muujin doona <em><strong>Lama ogola (Dhaxleed)</strong></em> hoos waxaa lagu xisaabinayo Dejinta)."
