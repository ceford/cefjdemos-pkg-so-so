COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla hadda waxay la socotaa adkaynta amaanka dheeraadka ah ee faylasha htaccess.txt iyo web.config.txt ee asalka ah. Adkaanashadan waxay joojinayaan dhaqanka loo yaqaan 'MIME-type sniffing' ee barnaamijyada shabakada. Daraasadani waxay keentaa taxane ah weerarro gaar ah, halkaasoo itusi sida faylasha caadiga u 'egyihiin (sida sawirada) loo fuliya, taasoo keeni karta dhibaatooyin XSS ah.</p><p>Kooxda ogaanshaha waxay ku talinayaan in cidda wax kabashada ay si toos ah u codsadaan isbadalada lagama maarmaanka ah faylasha .htaccess ama web.config, sida faylashani aan si toos ah loo casriyaynin.</p><p><strong>Isbaddallada .htaccess</strong><br>Kudar xariiqadaha soo socota ka hor \"## Mod_rewrite in use.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Isbaddallada web.config</strong><br>Kudar xariiqadaha soo socota ka dib \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>"
COM_CPANEL_MSG_ADDNOSNIFF_TITLE=".htaccess & web.config Cusboonaysiin Amni"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Tan iyo 3.9.21 Joomla waxaa lagusoo raray halis amni oo dheeri ah faylka asalka ah ee htaccess.txt. Halistaan waxay ilaali doontaa isticmaalayaasha faylasha svg dhibaatooyinka daciifnimada XSS.<br>Kooxda ogaanshaha waxay ku talinayaan in si toos ah isbadalka lagama maarmaanka ah loo sameeyo faylasha .htaccess ee jira, sida faylashaan aan si toos ah loo cusboonaysiin karin.</p><p><strong>Isbaddallada .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Hadda ma naqaan hab lagu qabanayo hab kubeegan IIS server-yada webka, fadlan la xiriir bixiyahaaga martiga si aad u helo taasi caawimaad.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="XSS Daahfurnaan Dheerad ah ee Isticmaalka Faylasha SVG"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Tan iyo Joomla! 3.4.0 waxaad la kulmi kartaa dhibaatooyin ku saabsan plugin-ka nidaamka - shaandhaynta luqadda ee boggaaga. Si aad u xalliso fadlan fur <a href=\"index.php?option=com_languages&view=languages\">Maamulaha Luqadda</a> oo kaydi luqad kasta si iskaa ah si loo hubiyo in heerka galitaanka la kaydsan yahay."
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="Waxaad la kulmi kartaa dhibaatooyin ku saabsan goobahaaga luqadaha kala duwan"
COM_CPANEL_MSG_ROBOTS_BODY="Isbeddelka lagu sameeyay faylasha robots.txt ee asalka ah ee Joomla! 3.3 si Goo-goo-dalwad iyo gacanta ugelys sidan jaraafadooda ku filan ay u helaan foomamka iyo faylasha kaqeyeeda si siilada ah ug helan SEO. Isbaddelkan si toos ah looma fulinayo casriyeynta iyo isticmaalayaasha lugu talinayaa inay dib u eegaan isbeddelada faylka robots.txt.dist oo keenaxul soo celin faylka ayagan kuukaununaan faylka robots.txt."
COM_CPANEL_MSG_ROBOTS_TITLE="robots.txt Casriyaynta"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Tan iyo Joomla! 3.5 plugin istatistik ah ayay gaarsiinaysa xog aan magaca lahayn mashruuca Joomla. Tani kaliya waxay gudbin doontaa nooca Joomla, nooca PHP, mashiinka xogta iyo nooca, iyo nidaamka qalliinka serverka.</p><p>Xogtaan ayaa la soo ururinayaa si loo hubiyo in wax yar ka jira mustaqbalka nooca Joomla ay ka faa'ideysan karto dhicisooyinka ugu dambeeyay ee xog ururinta iyo PHP aan saameyn ku yeelan isticmaalayaasha muhiimka ah. Baahida loogu baahday markii ugu yaraan 5.3.10 ee PHP ay noqotay looga baahan yahay Joomla! 3.3 markay hirgelisay furaha sirta ah ee Bcrypt ee amniga badan.</p><p>Danaha si daahfuran si ay uga caawiyaan horumarinta <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">xogtaan si dadweyne ah ayay loo heli karaa.</a> API iyo jaantusyo ayaa tusi doona nooca Joomla, noocyada PHP iyo makiinada xogbeeleynta ee loo istiqaalay.</p><p>Haddaad aan jeclayn inaad sugtid mashruuca Joomla xogtan waxaad damin kartaa plugin-ka loogu yeero Nidaamka - Istatistikada Joomla.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Ururinta Xogta ee Joomla"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>Qayb ka mid ah dib-u-eegista kooxda sugaalnimada, waxaan ku sameynay isbeddelo qaar ka mid ah goobaha kuyaal shaandhayayaasha qoraallada caalamiga ah jooga rakibid cusub oo Joomla. Deegaanka cusub ee 'Public', 'Guest' iyo 'Registered' hadda waa 'No HTML'. Maadaama isbeddelladan ay ku dabaqmaan kaliya rakibid cusub, waxaan si wayn ku talineynaa inaad dib u eegtaan isbeddelladan oo aad cusboonaysaan boggaaga: Nidaamka &rarr; Qaabka Guud &rarr; Shaandhayayaasha Qoraallada</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Talo Bixin Cusub ee Martiya Shaandhayaal Qoraallada"
