COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_ACTION="Awoodsiin Dejinta Ka Dambeeya Load Balancer"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>Joogtada Joomla ee ka dambeeya Load Balancers iyo Reverse Proxies waa la soo bandhigay dejin cusub ee Qaabka Guud ee Joomla 3.9.26</p><p>Marka dejintan la awoodsiiyo, waxay kuu oggolaan doontaa Balanserkaaga/Reverse Proxy-ga inuu bixiyo ciwaanka IP-ga ah ee dhabta ahaan u ah booqdayaashaada. IP-gaan ayaa markaa loogu adeegsan doonaa Diiwaanka Hawlaha iyo dabagalida codbixinta maqaalada (haddii astaamahaas la hawlgaliyo).</p><p><strong>Kaliya goobaha ka dambeeya Load Balancer/Reverse Proxy ayaa doonaya inay adeegsadaan astaantan.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="Dejin Cusub oo u ah Server \"Ka Dambeeya Load Balancer\""
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>Intii ka horeysay 3.9.22 faylka htaccess.txt wuxuu ku jiray qoraal khalad ah oo loogu talagalay jarista liisaska galka. Kooxda amniga waxay kugula talinayaan inaad si toos ah u codsato isbedelka lagama maarmaanka ah ee faylka .htaccess jira, maadaama faylkan aan si toos ah loo cusbooneysiin karin.</p><p>Koodhka Hore:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>Koodhka Cusub:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE=".htaccess Cusbooneysiinta Ku Saabsan Liisaska Galka"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>Intii ka horeysay 5.1.0 faylka htaccess.txt ma uusan taageerin cadaadinta Brotli. Tani waxay keeni kartaa qaladaad cadaadis laba-laabmay marka Joomla lagu rakibo server isticmaalaya cadaadinta Brotli. Waa inaad si toos ah u codsataa isbedelka lagama maarmaanka ah ee faylka .htaccess jira, maadaama faylkan aan si toos ah loo cusbooneysiin karin.</p><p>Koodhka Hore:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>Koodhka Cusub:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE=".htaccess Cusbooneysiinta Cadaadinta Brotli"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>Intii ka horeysay 4.2.9 faylka htaccess.txt wuxuu ku jiray koodh khalad ah oo loogu talagalay ku darista xarfaha HTTP \"Content-Encoding\". Tani waxay keeni kartaa qaladaad koodh laba-laab ah marka Joomla lagu rakibo galka hoose iyo labada galka iyo galka waalidka labaduba ay ka kooban yihiin faylka .htaccess lagu hayo koodhkaan. Waa inaad si toos ah u codsataa isbedelka lagama maarmaanka ah ee faylka .htaccess jira, maadaama faylkan aan si toos ah loo cusbooneysiin karin.</p><p>Koodhka Hore:</p><pre>Header append Content-Encoding gzip</pre><p>Koodhka Cusub:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE=".htaccess Cusbooneysiinta Ku Saabsan Dejinta Header-ka Content-Encoding"
