PLG_MULTIFACTORAUTH_YUBIKEY="Ujeedka Badbaadinta Wax ka badan - YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_CAPTIVE_PROMPT="Fadlan guji sanduuqa qoraalka ee hoose. Kadib geli YubiKey-gaaga dekedda USB-ga ee qalabkaaga oo taabo guudka dahabka ah ama gogosha dahabka ah (ku xiran noocaaga) si ay u soo saarto koodh YubiKey ah. Haddii aad ku jirto telefoon ama kiniin ay ka shaqeyso NFC oo leh YubiKey NFC firfircoon waxaad u baahan tahay inaad halkii ku dhawaato YubiKey-gaaga aagga akhristaha NFC ee telefoonkaaga ama kiniinka."
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="Koodhka YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_ERR_VALIDATIONFAILED="Ma aadan gelin koodh sir ah oo ansax ah YubiKey ama server-yada YubiCloud lama gaari karo waqtigan."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="Waxaad hore u dejisay YubiKey-gaaga (kan soo saaraya koodhadhka bilaabanaya <koodh>%s</koodh>). Kaliya waxaad bedeli kartaa ciwaanka laga bilaabo boggan."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="Fadlan sii koodh ay sameeyso <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a> hoose kadibna guji ama taabo badhanka Xaqiiji. Labada iyo tobankii dabeecadood ee ugu horreeya, kuwaas oo ah koodhka aqoonsiga ah ee YubiKey-gaaga, ayaa la keydin doonaa."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_LABEL="Aqoonsiga YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_PLACEHOLDER="Geli koodh YubiKey ah"
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="Isticmaal YubiKey token hardware ammaan ah."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="Waxay u oggolaataa dadka isticmaala ee ku sugan bartamahaaga inay isticmaalaan Badbaadinta Wax ka badan iyagoo adeegsanaya token hardware YubiKey ammaan ah. Isticmaalayaasha waxay u baahan yihiin YubiKey u gaar ah oo laga heli karo <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>. Si loo isticmaalo Badbaadinta Wax ka badan Isticmaalayaasha waa inay saxaan macluumaadkooda isticmaale oo ay muujiyaan Badbaadinta Wax ka badan."

