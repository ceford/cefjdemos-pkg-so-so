PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER_KEY="Cinwaanka HTTP"
PLG_SYSTEM_HTTPHEADERS_ADDITIONAL_HEADER_VALUE="Qiimaha Cinwaanka HTTP"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP' target='_blank' rel='noopener noreferrer'>Nidaamka Amniga ee Mawduuca (CSP)</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="Macmiil"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="Dami ilaalinta frame-ancestors ee CSP si looga hortago clickjacking oo ogolow kaliya isha 'self'. Fadlan isticmaal foomka hoose si aad u oggolaatid ilo kale intaan la oggolaan 'self'."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce' target='_blank' rel='noopener noreferrer'>Nonce</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Dami liiska cad ee qoraallada gudaha qaaska ah adiga oo isticmaalaya aqoonsi cronographic nonce (lambar hal mar la isticmaalay) dhammaan scripts-ka iyo qaababka isticmaalaya API Joomla. Magacaabidda nonce waxay browser-ka casriga ah u ogeysiineysaa 'unsafe-inline' taas oo weli la dejin doono browser-ka duugga ah ee aan la haynin nonce taageero."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="Isticmaal cinwaanka 'Content-Security-Policy-Report-Only' beddelka 'Content-Security-Policy'."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="Kaliya Warbixin"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="Hadalka strict-dynamic ilaha waxa uu caddaynayaa in kalsoonida si buuxda loo siiyey qoraal ku yaal calaamadeena, iyadoo lala socdo nonce ama hash, lagu fidiyo dhammaan qoraallada ay root script u rarka yihiin. Isla mar ahaan, wax kasta oo la oggol yahay ama ilaha la hal galiyo sida 'self' ama 'unsafe-inline' waa la iska indha tiri doonaa."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src' target='_blank' rel='noopener noreferrer'>Hashyada script-ka</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Dami liiska cad ee ikhtiyaariga ah ee hasaabta ku saleysan ee qoraallada gudaha adiga oo isticmaalaya hash ciwaandaro dhan qoraallada isticmaala API Joomla. Magacaabidda hash waxay browser-ka casriga ah u ogeysiineysaa 'unsafe-inline' taas oo weli la dejin doono browser-ka duugga ah ee aan la haynin hash taageero."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src' target='_blank' rel='noopener noreferrer'>Hashyada qaabka</a>"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Dami liiska cad ee ikhtiyaariga ah ee hasaabta ku saleysan ee qaababka gudaha adiga oo isticmaalaya hash ciwaandaro dhan qaababka isticmaala API Joomla. Magacaabidda hash waxay browser-ka casriga ah u ogeysiineysaa 'unsafe-inline' taas oo weli la dejin doono browser-ka duugga ah ee aan la haynin hash taageero."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="Ku dar Hal Qaawan"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="Qaawaan Nidaamka"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="Qiimaha"
PLG_SYSTEM_HTTPHEADERS_COOP="Qorshaha Furan ee Isku-dhafida Asalka"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT="Macmiil"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="Labada"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security' target='_blank' rel='noopener noreferrer'>Dhaqaajinta Gaadiidka Adag ee HTTP (HSTS)</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="da'da ugu badan"
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="Ikhtiyaarkan wuxuu dejiyaa waqtiga loogu talagalay 'da'da ugu badan', waxaa lagu qeexay il-biriqsi. Qiimaha caadiga ah waa 31536000, oo la macno ah sanad."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href='https://hstspreload.org' target='_blank' rel='noopener noreferrer'>Ka hor dhig</a>"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="Ikhtiyaarkan wuxuu dhaqaajiyaa ka qaybgalka in lagu daro liisaska la yiraahdo liisaska ka hor-dhigista daalacashada."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="Muhiim"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="HSTS waxay la macno tahay in aadan mar dambe wici karin domain-kaaga adigoon isticmaalin HTTPS. Marka lagu daro liiska ka hor-dhigista waxaa adag in lawareejiyo. Domain-ka waa la saari karaa, laakiin waxay qaadataa bilo in isticmaaleyaashu wax beddelaan iyaga oo cusboonaysiinaya daalacashada.<br><strong>Ikhtiyaarkan waa mid aad muhiim u ah si looga hortago 'weerarada dhex-dhexaadiyaasha', markaa waa inuu qaataa ama ha ahaato, laakiin kaliya haddii aad hubto in HTTPS uu taageerayo domainka iyo dhammaan subdomains-ka muddo dheer! Qiimaha 'da'da ugu badan' waa in loo dejiyaa 63072000 (2 sano) si loo duubo.</strong>"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="Sidoo kale u diri subdomains-yada"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="HSTS waa in sidoo kale loo dhaqaajiyaa <strong>subdomains-yada</strong> badanaa subdomain 'www' ayaa la tixgeliyaa marka la abuurayo shahaadada SSL. Haddii la isticmaalo subdomains kale, fadlan ogow in sidoo kale lagu bixiyo shahaado SSL sax ah."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="Karti geli cinwaanno amniga caadiga ah"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Joomla! waxay la timid qalab aad kula tacaali karto cinwaannada amniga ee http. Cinwaannadan waxay ka caawiyaan daalacashadaada tusaale ahaan inay ka ilaaliso websaydhkaaga weerarada <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a> iyo <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>Clickjacking</a>.</p><p>Waad heli kartaa faahfaahin dheeri ah gudaha <a href='https://docs.joomla.org/Special:MyLanguage/J4.x:Http_Header_Management' target='_blank' rel='noopener noreferrer'>Namooliyaha Maareynta Cinwaanada HTTP gudaha dukumeentiga Joomla!</a></p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="Cinwaannada Amniga HTTP"
