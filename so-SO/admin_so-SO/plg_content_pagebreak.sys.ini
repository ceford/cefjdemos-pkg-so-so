PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>U oggolow abuurista maqaal leh bogag kala bixin ah iyadoo xulashadu tahay miiska dulucda.</p><p>Keen jebinta bogga adiga oo isticmaalaya badhanka jebinta bogga ee sida caadiga ah laga helo sanduuqa qabitaanka qalabka tifatiraha WYSIWYG. Goobta jebinta bogga ee maqaalka ayaa lagu soo bandhigi doonaa tifatiraha sida xariiq toosan oo fudud.</p><p>Qoraalka la soo bandhigayaa wuxuu ku xirnaan doonaa xulashooyinka la doortay wuxuuna noqon karaa cinwaanka, qoraal beddel ah (haddi la bixiyay) ama lambarrada bogga.</p><p>Isticmaalka HTML waa:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Cinwaanka bogga&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Bogga koowaad&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Cinwaanka bogga&quot; alt=&quot;Bogga koowaad&quot; /&gt; ama <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Bogga koowaad&quot; title=&quot;Cinwaanka bogga&quot; /&gt;</p>"

