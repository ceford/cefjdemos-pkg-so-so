COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTSET="Kaydka ku meel gaadhka ah ee Joomla lama dejin."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTSETDESC="Kani waa galka ay Joomla ku koobiyo kordhinta, u kala saarid kordhinta iyo faylasha oo markaas loo nuqulo adeegyada saxda ah. Haddii meeshaani aan lagu dejin configuration.php ($tmp_path) markaa ma awoodi doontid inaad galiso kordhinno. Samee gal si Joomla ay ugu qorto galka si dhibaatadu u dayacibaxdo."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLE="Kaydka ku meel gaadhka ah ee Joomla lama qori karo ama ma jiro."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLEDESC="Tani waxay keeni kartaa dhibaatooyin marka la isku dayo in la xareeyo kordhinta Joomla. Haddii aad dhibaatooyin ku qabtid inaad xareyso kordhinno, hubi in galka lagu qeexay configuration.php uu jiro ama hubi '%s' qalbiga u ah ka dibna u dejiso in la qoro loogu dayi doono haddii tani u hagaajiso dhibaato."
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYDESC="Xadka xusuusta PHP waxaa lagu dejiyay in ka yar 16MB taas oo keeni karta dhibaatooyin marka la rakibtay kordhinta weyn. Fadlan u dejiso xadiga xusuusta ugu yaraan 32MB."
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYWARN="Xadiga xusuusta PHP oo hooseeya."
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYDESC="Xadka xusuusta PHP waxaa lagu dejiyay in ka yar 24MB taas oo keeni karta dhibaatooyin marka la rakibtay kordhinta weyn. Fadlan u dejiso xadiga xusuusta ugu yaraan 32MB."
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYWARN="Xadiga macquulka ah ee xusuusta PHP oo hooseeya."
COM_INSTALLER_MSG_WARNINGS_NONE="Wax digniin ahi lama oga."
COM_INSTALLER_MSG_WARNINGS_NOTCOMPLETE="<h1>Digniin: Cusboonaysiin Aan Dhamaanin!</h1><p>Cusboonaysiintu kaliya qayb ahaan ayaa dhammaatay. Fadlan samee cusboonaysiintii labaad si aad u dhammaystirto habka.</p>"
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSET="Kaydka ku meel gaadhka ah ee PHP lama dejin."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSETDESC="Kani waa faylka PHP isticmaalo si uu u kaydiyo faylka la soo geliyo ka hor inta aan Joomla awoodin inay hesho faylkan. In kasta oo galka la deji la'aantu aysan had iyo jeer dhibaato ahayn, haddii aad dhibaato ka qabtid faylalka foomamka oo aan la ogaan ama faylalka gala oo aan la ogaan, in lagu dejiyo faylkaaga php.ini waxay dayacibaxin kartaa dhibaato."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLE="Kaydka ku meel gaadhka ah ee PHP lama qori karo."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLEDESC="Galkaan lama qori karo una yahay Joomla! Tani waxay keeni kartaa dhibaatooyin marka la isku dayo in la xareeyo kordhinta Joomla. Haddii aad probleem ku qabatid inaad kor u dallicid kusameyso kordhinno, hubi '%s' qalbiga u ah ka dibna u dejiso in la qoro loogu dayi doono haddii tani dayacibaxso dhibaato."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZE="Cabirka dhabta u saraysan ee 'POST' ee PHP ayaa yar."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZEDESC="Kani waa tirada ugu badan ee xogta loo diri karo server-ka iyada oo loo marayo POST. Tani waxaa ka mid ah gunooyinka maqaallada, warbaahinta (sawirrada, videos) iyo kordhinta. Qiimahan wuxuu ka yar yahay 16MB kaas oo saameyn kara kor u qaadida kordhinta waa weyn. Tani waxaa lagu dejiyay php.ini hoosteeda post_max_size."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZE="Cabirka faylka faylka ugu badan ee PHP aad buu u yar yahay."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZEDESC="Cabirka faylka ugu badan ee la xareyn karo ayaa lagu dejiyay wax ka yar 16MB taas oo saameyn karta in la rarayo kordhinta waa weyn. Tani waxaa lagu dejiyay php.ini oo ku yaala labadaba dejiista max_upload_size iyo post_max_size ee dejiyahaada PHP (ku yaala faylka php.ini iyo/ama .htaccess). Qiimaha post_max_size waa inuu ka weyn yahay qiimaha max_upload_size."
COM_INSTALLER_MSG_WARNINGS_UPDATE_NOTICE="Ka hor inta aadan cusbooneysiin xaqiiji in cusboonaysiintu ay la jaanqaadayso rakibida Joomla! <br> Waxaa si adag lagugu talinayaa inaad samaysato <strong>keyd</strong> oo faylashaaga goobta iyo keydka macluumaadka ka hor intaadan bilaabin cusboonaysiinka."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOST="Cabirka faylka Upload ee PHP ayaa ka weyn cabirka POST."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOSTDESC="Qiimaha max_upload_size ee faylka php.ini waa ka weyn yahay isbedelka post_max_size. Isbeddelka post_max_size ayaa qaadan doona mudnaan wuxuuna hawl-ku-iddiladi doonaa codsiyada kasi weyn. Tani guud ahaan waa khalad ku saabsan server-ka markaad isku dayeyso inaad kordhiso cabirrada faylka. Fadlan u kordhi qiimaha post_max_size ka weyn qiimaha max_upload_size."
