COM_PRIVACY_CONFIRM_REMIND_SUCCEEDED="Oggolaanshahaaga Siyaasadda Arrimaha Gaarka ah ee boggan waa la kordhiyay."
COM_PRIVACY_CONFIRM_REQUEST_FIELDSET_LABEL="Email ayaa loo diray cinwaankaaga email-ka. Fadlan ku dheji aqoonsiga xaqiijinta ee email-ka foomka hoose si aad u caddeyso inaad tahay milkiilaha macluumaadka la codsanayo."
COM_PRIVACY_CONFIRM_REQUEST_SUCCEEDED="Codsigaaga macluumaad waa la xaqiijiyay. Waxaan u shaqeyn doonaa codsigaaga sida ugu dhaqsaha badan waxaana dhoofinta loo diri doonaa email-kaaga."
COM_PRIVACY_CREATE_REQUEST_SUCCEEDED="Codsigaaga macluumaad waa la sameeyay. Ka hor inta aan la farsameyn, waa inaad xaqiijisaa codsigan. Email ayaa loo diray cinwaankaaga oo wata tilmaamo dheeraad ah si aad u dhammaystirto xaqiijintaan."
COM_PRIVACY_EMAIL_REQUEST_BODY_EXPORT_REQUEST="Qof ayaa abuuray codsi ah in la dhoofiyo dhammaan macluumaadka shakhsiga ah ee la xiriira cinwaankan email-ka ee {URL}. Tallaabo ammaan ah, waa inaad xaqiijisaa in tani ay tahay codsi sax ah oo loogu talagalay la-tashiga macluumaadka shakhsiyeed ee boggan.\n\nHaddii tan la khaladey, iska iloow email-kan waxna ma dhici doonaan.\n\nSi aad u xaqiijiso codsigan, waxaad dhammayn kartaa mid ka mid ah hawlaha soo socda:\n\n1. Booqo URL-kan soo socda: {TOKENURL}\n\n2. Ka nuqul token-kaaga email-kan, booqo URL-ka la xusay, kuna dheji token-kaaga foomka.\nURL: {FORMURL}\nToken: {TOKEN}\n\nFiiro gaar ah u yeelo in aqoonsigan uu ansax yahay 24 saacadood oo keliya laga bilaabo waqtiga emailkan la diray."
COM_PRIVACY_EMAIL_REQUEST_BODY_REMOVE_REQUEST="Qof ayaa abuuray codsi ah in la saaro dhammaan macluumaadka shakhsiga ah ee la xiriira cinwaankan email-ka ee {URL}. Tallaabo ammaan ah, waa inaad xaqiijisaa in tani ay tahay codsi sax ah oo loogu talagalay tirtirka macluumaadka shakhsiyeed ee boggan.\n\nHaddii tan la khaladey, iska iloow email-kan waxna ma dhici doonaan.\n\nSi aad u xaqiijiso codsigan, waxaad dhammayn kartaa mid ka mid ah hawlaha soo socda:\n\n1. Booqo URL-kan soo socda: {TOKENURL}\n\n2. Ka nuqul token-kaaga email-kan, booqo URL-ka la xusay, kuna dheji token-kaaga foomka.\nURL: {FORMURL}\nToken: {TOKEN}\n\nFiiro gaar ah u yeelo in aqoonsigan uu ansax yahay 24 saacadood oo keliya laga bilaabo waqtiga emailkan la diray."
