JLIB_RULES_SETTING_NOTES="Haddii aad bedesho xulashada, waxay saameyn doontaa tan iyo dhamaan kooxaha hoose, qaybaha iyo waxa ku jira. Ogow in <em><strong>Lagu Diiday</strong></em> ay ka sarreyn doonto setting kasta oo dhaxal ah iyo sidoo kale settings kasta oo ku jira koox-hoosaad, qayb ama waxyaabaha ku jira. Marka la helo khilaaf setting ah, <em><strong>Diidmo</strong></em> ayaa qaadan doonta mudnaanta. <em><strong>Lama Dhigin</strong></em> waa wax u dhigma <em><strong>Lagu Diiday</strong></em> laakiin waa la beddeli karaa kooxaha hoose, qaybaha iyo waxyaabaha ku jira."
JLIB_RULES_SETTING_NOTES_ITEM="Haddii aad bedesho xulashada, waxay saameyn doontaa sheygan. Ogow:<br><em><strong>Dhaxlay</strong></em> waxay ka dhigan tahay in rukhsaduhu ka imaan doonaan qaabeynta guud, koox-hoosaad iyo qaybooyinku.<br><em><strong>Lagu Diiday</strong></em> waxay ka dhigan tahay in aan loo ogolaan doonin iyadoon loo eegin waxa ay yihiin qaabeynta guud, koox-hoosaadka ama qaybaha, kooxda la tifaftirayo ma qaadan karto tallaabadan sheygan.<br><em><strong>La ogolaaday</strong></em> waxay ka dhigan tahay in kooxda la tifaftirayo ay awoodi doonto inay tallaabadan ku qaadaaan sheygan (laakiin haddii tani ay la socoto qaabeynta guud, koox-hoosaad ama qayb ah ma lahan saameyn; khilaaf waxa lagu muujinayaa <em><strong>Aan loo Ogolayn (Dhaxlay)</strong></em> hoosta Xulashooyinka Xisaabta."
