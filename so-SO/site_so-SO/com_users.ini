COM_USERS_EMAIL_REGISTERED_WITH_ACTIVATION_BODY="Salaan {NAME},\n\nWaad ku mahadsan tahay isdiiwaangelinta {SITENAME}. Koontadaada waa la sameeyey lana firfircoonayn ka hor intaadan isticmaalin.\nSi aad koontada u firfircoonaato dooro xiriirka hoose ama koobi-geli biraawsarkaaga:\n{ACTIVATE} \n\nKa dib markaad firfircoonaato waxaad ku soo gali kartaa {SITEURL} adigoo isticmaalaya magaca isticmaalaha iyo erayga sirta ah ee soo socda:\n\nMagaca isticmaalaha: {USERNAME}\nErayga sirta ah: {PASSWORD_CLEAR}"
COM_USERS_EMAIL_REGISTERED_WITH_ACTIVATION_BODY_NOPW="Salaan {NAME},\n\nWaad ku mahadsan tahay isdiiwaangelinta {SITENAME}. Koontadaada waa la sameeyey lana firfircoonayn ka hor intaadan isticmaalin.\nSi aad koontada u firfircoonaato dooro xiriirka hoose ama koobi-geli biraawsarkaaga:\n{ACTIVATE} \n\nKa dib markaad firfircoonaato waxaad ku soo gali kartaa {SITEURL} adigoo isticmaalaya magaca isticmaalaha iyo erayga sirta ah ee aad isdiiwaangelinta ku qortay:\n\nMagaca isticmaalaha: {USERNAME}"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY="Salaan {NAME},\n\nWaad ku mahadsan tahay isdiiwaangelinta {SITENAME}. Koontadaada waa la sameeyey lana xaqiijinayaa ka hor intaadan isticmaalin.\n\nSi aad koontada u xaqiijiso, dooro xiriirka hoose ama koobi-geli biraawsarkaaga:\n{ACTIVATE} \n\nKa dib markaad xaqiijiso waxaa la ogeysiin doonaa maamulaha si uu koontadaada u firfircoonaado. Waxaad heli doontaa xaqiijinta marka la sameeyo.\n\nMarka koontadani la firfircoonaado waxaad ku soo gali kartaa {SITEURL} adigoo isticmaalaya magaca isticmaalaha iyo erayga sirta ah ee soo socda:\n\nMagaca isticmaalaha: {USERNAME}\nErayga sirta ah: {PASSWORD_CLEAR}"
COM_USERS_EMAIL_REGISTERED_WITH_ADMIN_ACTIVATION_BODY_NOPW="Salaan {NAME},\n\nWaad ku mahadsan tahay isdiiwaangelinta {SITENAME}. Koontadaada waa la sameeyey lana xaqiijinayaa ka hor intaadan isticmaalin.\n\nSi aad koontada u xaqiijiso, dooro xiriirka hoose ama koobi-geli biraawsarkaaga:\n{ACTIVATE} \n\nKa dib markaad xaqiijiso waxaa la ogeysiin doonaa maamulaha si uu koontadaada u firfircoonaado. Waxaad heli doontaa xaqiijinta marka la sameeyo.\n\nMarka koontadani la firfircoonaado waxaad ku soo gali kartaa {SITEURL} adigoo isticmaalaya magaca isticmaalaha iyo erayga sirta ah ee aad isdiiwaangelinta ku qortay:\n\nMagaca isticmaalaha: {USERNAME}"
COM_USERS_EMAIL_USERNAME_REMINDER_BODY="Salaan,\n\nWaxaa lagu codsaday in la xasuusiyo magaca isticmaaluhu ee akoonkaaga {SITENAME}.\n\nMagacaaga isticmaalaha: {USERNAME}\n\nSi aad ugu soo gasho akoonkaaga, xullo xiriirka hoose.\n\n{LINK_TEXT} \n\nMahadsanid."
