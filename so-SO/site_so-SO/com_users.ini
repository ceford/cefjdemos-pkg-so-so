COM_USERS_EMAIL_REGISTERED_BODY="Salaan {NAME},\n\nWaad ku mahadsan tahay isdiiwaangelinta {SITENAME}.\n\nHadda waxaad ku soo gali kartaa {SITEURL} adigoo isticmaalaya magaca isticmaalaha iyo erayga sirta ah ee soo socda:\n\nMagaca isticmaalaha: {USERNAME}\nErayga sirta ah: {PASSWORD_CLEAR}"
