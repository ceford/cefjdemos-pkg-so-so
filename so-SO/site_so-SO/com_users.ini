COM_USERS_EMAIL_ACTIVATE_WITH_ADMIN_ACTIVATION_SUBJECT="Ansixinta diiwaangelinta loo baahan yahay ee koontada {NAME} ee {SITENAME}"
COM_USERS_EMAIL_PASSWORD_RESET_BODY="Salaan,\n\nCodsi ayaa la sameeyey si loo cusboonaysiiyo eraygaaga sirta ah {SITENAME}. Si aad u cusboonaysiiso eraygaaga sirta ah, waxaad u baahan doontaa inaad dhiibto lambarkan xaqiijinta si loo xaqiijiyo in codsigu saxan yahay.\n\nLambarka xaqiijinta waa {TOKEN}\n\nXullo URL-ka hoos ku qoran oo sii wad inaad cusboonaysiiso eraygaaga sirta ah.\n\n{LINK_TEXT} \n\nMahadsanid."
