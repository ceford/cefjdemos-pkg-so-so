JGLOBAL_FILTER_TYPE_DESC="<p>1. Liiska Reebban wuxuu ogol yahay dhammaan tags iyo astaamaha marka laga reebo kuwa ku qoran.<br><strong>--</strong> Tags ee Liiska Reebbangaha ah waxaa ka mid ah: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Astaamaha ee Liiska Reebban waxaa ka mid ah: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Waxaad ku reebi kartaa tags dheeraad ah iyo astaamo adigoo ku daraya Goobo Sifee iyo Astaamaha Sifee, kala saar mid kasta oo magac tag ama astaan leh faas.<br><strong>--</strong> Liiska Reebbangaha La Habeeyay wuxuu kuu oggolaanaa inaad dib ugu beddesho Liiska Reebbaanka ah. Ku dar tags iyo astaamo si loo reebo goobaha Tags Sifee iyo Astaamaha Sifee.</p><p>Liiska Ogol wuxuu keliya oggolaadaa tags ku qoran Goobo Tags Sifee iyo Astaamaha Sifee.</p><p>Ma Jiro HTML wuxuu ka saarayaa dhammaan tags HTML maadada marka la badbaadiyo.</p><p>Fadlan ogow in dejimahaas ay shaqeeyaan xitaa haddii aad isticmaaleyso tafatire WYSIWYG. <br>Xitaa haddii aad isticmaaleyso tafatire WYSIWYG, dejinta sifeynta waxay ka saari kartaa tags dheeraad ah iyo astaamo ka hor marka xogta lagu keydiyo xogta.</p>"
